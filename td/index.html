<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>P의 디펜스</title>
<!-- PWA(checklist J-0, 2026-09-06): 홈 화면 앱 + 오프라인. 글꼴은 로컬(vendor/fonts — 나눔 빌드는 assets/fonts). 밖에서 가져오는 것 0개 -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0E1410">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="P의 디펜스">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="assets/fonts/jua.local.css" id="fontCss">
<style>
  /* ---------- 글꼴 (checklist K-2-6) ----------
     제목·숫자·버튼 = 「검은고딕」(Black Han Sans) — 굵고 각진 한국어 게임체. 본문 = 기존 Jua(둥근 게임체).
     둘 다 SIL 오픈폰트 라이선스(OFL 1.1)라 폰트 파일을 저장소에 넣어 같이 배포해도 된다(assets/fonts/LICENSE.txt 에 원문·출처).
     밖(구글 서버 등)에서 가져오는 것 0개 — PWA 오프라인 규칙(J-0)을 지킨다. */
  @font-face { font-family: 'BlackHanSans'; font-style: normal; font-weight: 400; font-display: swap;
    src: url(assets/fonts/black-han-sans-latin-400.woff2) format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  @font-face { font-family: 'BlackHanSans'; font-style: normal; font-weight: 400; font-display: swap;
    src: url(assets/fonts/black-han-sans-korean-400.woff2) format('woff2'); }
  /* ---------- 로딩 화면(화면 설계안 5번): 진행 막대 · 게임 그림 · 짧은 팁. 로딩을 숨기지 않고 게임답게 보여준다(사장님: "로딩시간은 당연한 거야") ---------- */
  #loading { position: fixed; inset: 0; z-index: 100; background: #0E1410 center / cover no-repeat; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding: 0 22px calc(46px + env(safe-area-inset-bottom)); color: #fff; font-family: "Jua", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif; transition: opacity .45s; }
  #loading::before { content: ""; position: absolute; inset: 0; background: linear-gradient(rgba(10,16,24,.15), rgba(10,16,24,.2) 45%, rgba(10,16,24,.92) 78%); pointer-events: none; }
  #loading > * { position: relative; }
  #loading.out { opacity: 0; pointer-events: none; }
  #loading .title { margin: 0 0 18px; font-size: 44px; color: #FFC93C; text-shadow: 1px 1px 0 #000, -1px 1px 0 #000, 1px -1px 0 #000, -1px -1px 0 #000, 0 2px 0 #000, 0 -2px 0 #000, 2px 0 0 #000, -2px 0 0 #000, 0 6px 0 rgba(0,0,0,.35); }
  #loading .bar { width: min(360px, 100%); height: 26px; border-radius: 999px; background: #FFF7E6; border: 3px solid #6B4A2B; box-shadow: 0 4px 0 #4A3320, 0 6px 12px rgba(0,0,0,.35); position: relative; overflow: hidden; }
  #loading .bar .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: linear-gradient(#8CE86A, #46B83A); transition: width .25s; }
  #loading .bar .fill::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(-45deg, rgba(255,255,255,.22) 0 10px, transparent 10px 20px); animation: stripes 1s linear infinite; }
  @keyframes stripes { to { transform: translateX(28px); } }
  #loading .bar .pct { position: absolute; left: 0; right: 0; top: 0; line-height: 20px; text-align: center; font-size: 15px; color: #fff; text-shadow: 1px 1px 0 #000, -1px 1px 0 #000, 1px -1px 0 #000, -1px -1px 0 #000; font-variant-numeric: tabular-nums; }
  #loading .what { margin-top: 8px; font-size: 13px; color: #D7DEE8; min-height: 1.3em; }
  #loading .tip { margin-top: 18px; padding: 8px 16px; border-radius: 14px; background: rgba(255,247,230,.92); color: #2B1D12; border: 3px solid #6B4A2B; box-shadow: 0 4px 0 #4A3320; font-size: 15px; text-align: center; max-width: 360px; line-height: 1.4; animation: tipIn .35s; }
  @keyframes tipIn { from { opacity: 0; transform: translateY(8px); } }
  #loading .tip b { color: #B8860B; }
  /* 게임 UI 원칙(참고: 인기 모바일 디펜스 화면): 가장자리에 UI, 중앙은 3D. 불투명 크림 패널 + 두꺼운 갈색 테두리 + 입체 그림자.
     아이콘+숫자만(라벨 없음). 숫자는 굵은 라운드체 + 검은 외곽선. 버튼은 원색·눌리면 내려간다. 이모지 없음 — 전부 SVG.
     흐름(design.md 12장): 메뉴 → 월드맵(점 20개) → 전투 → 결과(별) → 월드맵. 무한 모드는 따로(스테이지 10 뒤). 덱 편성 없음. */
  :root {
    --cream: #FFF7E6; --cream2: #F3E7CC; --brown: #6B4A2B; --brown2: #4A3320; --ink: #2B1D12; --ink2: #6B5A48;
    --gold: #FFC93C; --gold2: #B48000; --blue: #1C9FD7; --blue2: #146587; --green: #16BB77; --green2: #046D41; --red: #EE2747; --red2: #871023;
    --stroke: 1px 1px 0 #000, -1px 1px 0 #000, 1px -1px 0 #000, -1px -1px 0 #000, 0 2px 0 #000, 0 -2px 0 #000, 2px 0 0 #000, -2px 0 0 #000;
    /* 🔴 2026-09-08: 위 먹선은 2px 이라 큰 글자용이다. 12~13px 작은 글자에 두르면 획이 메워져 뭉개진다
       (사장님 사진에서 「피해 +25%」가 읽기 힘들었다). 작은 글자는 아래 얇은 것을 쓴다. */
    --stroke-thin: 0 1px 0 rgba(0,0,0,.6), 1px 0 0 rgba(0,0,0,.4), -1px 0 0 rgba(0,0,0,.4), 0 -1px 0 rgba(0,0,0,.4);
    /* 글꼴 두 벌 (K-2-6): 굵고 각진 제목체 / 둥근 본문체. 시스템 한글(맑은 고딕 등)이 마지막 그물이라 어떤 글자도 빈칸이 되지 않는다 */
    --f-title: 'BlackHanSans', 'Jua', 'Malgun Gothic', 'Apple SD Gothic Neo', system-ui, sans-serif;
    --f-body: 'Jua', 'Malgun Gothic', 'Apple SD Gothic Neo', system-ui, sans-serif;
    /* 그림 UI (K-2-4): Kenney 2D 팩(CC0)을 우리 색으로 물들인 9칸 늘리기(9-slice) 그림. 출처·라이선스는 assets/ui/LICENSE.txt */
    --ui-frame: url(assets/ui/frame-brown.png);
    --ui-frame-gold: url(assets/ui/frame-gold.png);
    /* 여백 한 벌 (checklist K-2-10, 2026-09-07 사장님: "대부분 텍스트 박스가 너무 지저분하거나 위아래 여백이 균일하지도 않아")
       실측에서 로비 한 화면에만 서로 다른 여백 조합이 11가지였고 위아래가 다른 곳이 4군데였다(0/8 · 6/8 · 4/8 · 6/2).
       🛑 새 여백은 반드시 이 다섯 중 하나로 쓴다. 위아래는 특별한 이유가 없으면 같게. */
    --sp1: 4px; --sp2: 8px; --sp3: 12px; --sp4: 16px; --sp6: 24px;
  }
  /* 글자 외곽선 — 크롬 123+ 는 진짜 외곽선(paint-order: stroke)으로 또렷하게, 옛 브라우저는 8방향 그림자로 되돌린다.
     🛑 폴백이 없으면 -webkit-text-stroke 만 걸려 한글 획 안쪽이 파먹혀 통째로 뭉개진다 */
  /* 🛑 굵은 제목체 + 8방향 검정 그림자를 겹치면 「뽑」처럼 획이 많은 글자의 속공간이 검게 메워져 글자가 통째로 사라진다
     (2026-09-07 뽑기 화면 실측 — 제목 "뽑기"가 "-기"로 보였다).
     그래서 큰 글자는 진짜 외곽선으로 바꾼다: paint-order: stroke fill = 선을 글자 「뒤」에 그려 속공간을 막지 않는다.
     조카 폰이 구형이라 paint-order 를 모르면 -webkit-text-stroke 만 남아 획 안쪽이 파먹히므로, 그때는 8방향 그림자로 통째로 되돌린다.
     🛑 외곽선 두께는 반드시 em(글자 크기에 비례)으로 준다. px 로 고정하면 작은 제목에서 획 사이 틈보다 선이 두꺼워져
     글자가 다시 검은 덩어리가 된다(2026-09-07 실측: 26px 제목 + 3px 선 = "뽑"이 뭉갬 / 64px 에서는 멀쩡). */
  h1, .title, .ptitle, #banner, .ol { -webkit-text-stroke: 0.055em #000; paint-order: stroke fill; text-shadow: none; }
  .ol.thin { -webkit-text-stroke: 0.04em #000; }
  /* 🔴 2026-09-08 (사장님 사진): 위 외곽선은 **3D 화면 위 흰 글자**를 읽히게 하려고 넣은 것이다.
     그런데 `.panel.title` 처럼 **크림 판 위 진한 글자**에도 걸려 있었다. 검은고딕은 원래 아주 굵어서
     거기에 검은 획을 더하면 ㅜ·ㅗ 획 사이가 메워져 「불꽃」이 「블꽃」으로 보인다.
     판은 자기 바탕이 있어 외곽선이 필요 없다 — 뺀다. */
  .panel.title, .panel .title, .panel .ptitle { -webkit-text-stroke: 0; text-shadow: none; }
  @supports not (paint-order: stroke) {
    h1, .title, .ptitle, #banner, .ol, .ol.thin { -webkit-text-stroke: 0; text-shadow: var(--stroke); }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin: 0; background: #0E1410; color: var(--ink); font-family: var(--f-body); overflow: hidden; font-size: 15px; }
  /* 굵고 각진 제목체가 붙는 자리 (K-2-6): 큰 제목 · 배너 · 버튼 글씨 · 숫자 · 탭 이름 — 「읽는 글」이 아니라 「보는 글」 전부 */
  /* 🛑 검은고딕은 획이 아주 굵어 20px 미만 한글에서 자소가 서로 붙어 뭉갠다(2026-09-07 폰 390×844 실측 — "루아"가 "무아"로 보였다).
     그래서 20px 이상 「보는 글」에만 쓴다: 큰 제목 · 배너 · 버튼 글씨 · 숫자. 나머지 작은 글씨는 전부 둥근 본문체 Jua. */
  /* 🛑 font-weight 를 반드시 400 으로 못박는다. 검은고딕은 굵기가 하나(이미 Black)뿐이라, h1·h2·b 처럼 기본이 굵은 자리에서는
     브라우저가 「인공 굵게」를 덧칠한다 → 획이 서로 붙어 글자가 새까만 덩어리가 된다
     (2026-09-07 실측: 뽑기 화면 제목 "뽑기"가 통째로 검은 사각형이 됐다. 같은 26px 라도 굵기 400 이면 멀쩡하다) */
  h1, h2, .btn, .num, .fl, .title, .ptitle, #banner, .diffbtn .dname { font-family: var(--f-title); font-weight: 400; }
  h1 b, h2 b, .btn b, .num b, .title b { font-weight: 400; }
  .sub, .dsub, .dlock, small, .btn small, .btn .sub, .rw, .ok, .prog { font-family: var(--f-body); font-size: inherit; }
  /* 🛑 「작은 버튼」도 예외 없이 본문체다. .btn 전체에 제목체를 걸어 놓아서 15px 이하 버튼([방법][닫기][받기][이동][팔기]…)의
     한글이 뭉개져 있었다 — 위 20px 규칙을 적어 놓고 정작 버튼에서 지키지 않았다(2026-09-07 미션 페이지에서 다시 확인). */
  .btn.tiny, .mission .mbtn, .btn.brn, .modal .row .btn, .panel.list .btn, .row.confirm .btn,
  .world-head .btn.gold, .grow-gacha .btn, .a2hs .btn, .gbtn, .rbtn { font-family: var(--f-body); }
  #stage { position: fixed; inset: 0; }
  /* ---------- 화면 마무리(2026-09-08, 사장님 "그래픽이 너무 구려") ----------
     ⑴ 색보정: 3D 화면이 날것 그대로 나가고 있었다 — 허옇고 평평했다. 대비·채도를 살짝 올리고 아주 조금 어둡게.
     ⑵ 가장자리 어둡게(비네트): 눈이 화면 가운데(게임판)로 모인다. 출시된 게임이 거의 다 하는 것.
     🔑 왜 CSS 로 하나 — 후처리(빛번짐)는 품질 4단에서만 켜진다. 그러면 좋은 폰에서만 보인다.
        이건 브라우저가 화면을 합칠 때 같이 처리해서 **모든 폰·모든 품질 단계에서** 똑같이 나온다.
        WebGL 화면 버퍼를 하나 더 만들지 않으므로 폰 메모리도 안 먹는다.
     🛑 UI(버튼·글자)에는 걸지 않는다 — 게임 화면(캔버스)에만 건다. UI 색은 이미 맞춰 둔 것이다. */
  :root { --grade: contrast(1.10) saturate(1.14) brightness(0.97); }
  #stage canvas { filter: var(--grade); }
  #vignette { position: fixed; inset: 0; pointer-events: none; z-index: 1;
    background: radial-gradient(ellipse 74% 58% at 50% 45%, rgba(0,0,0,0) 34%, rgba(10,20,14,.26) 68%, rgba(6,13,9,.52) 88%, rgba(4,10,7,.66) 100%); }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  svg.i { width: 1em; height: 1em; vertical-align: -0.15em; fill: currentColor; }
  .num { font-weight: 400; color: #fff; text-shadow: var(--stroke); letter-spacing: .02em; font-variant-numeric: tabular-nums; }
  .num.gold { color: var(--gold); }
  .num.red { color: #FF6B5E; }
  .num.green { color: #7CE76A; }

  /* 패널·버튼 재질 */
  /* 패널 = 크림 바탕 + 「그림 테두리」. border-image 로 그림 한 장이 어떤 크기의 판이든 감싼다(9칸 늘리기).
     border-image-width 를 따로 줘서 테두리 그림만 두껍게 그리고 레이아웃(안쪽 여백)은 그대로 둔다 — 이걸 안 하면 화면이 통째로 밀린다 */
  .panel { background: var(--cream); border: 3px solid transparent; border-radius: 14px; border-image: var(--ui-frame) 32 stretch; border-image-width: 16px; box-shadow: 0 4px 0 var(--brown2), 0 6px 12px rgba(0,0,0,.35); color: var(--ink); }
  .pill { display: inline-flex; align-items: center; gap: 8px; padding: 4px 12px 4px 8px; border-radius: 999px; background: var(--cream); border: 3px solid var(--brown); box-shadow: 0 3px 0 var(--brown2), 0 5px 10px rgba(0,0,0,.3); font-size: 20px; white-space: nowrap; }
  .pill svg.i { font-size: 22px; }
  /* 버튼도 그림(9칸 늘리기). 그림 안에 이미 위쪽 광택과 아래쪽 두께가 들어 있어 색만 칠한 네모보다 훨씬 단단해 보인다.
     아래 각진 그림자(0 5px 0)는 그대로 둔다 — 누르면 그림자가 사라지며 버튼이 내려앉는다. 🛑 큰 번짐 그림자는 쓰지 않는다(느려진다) */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; font: inherit; font-family: var(--f-title); color: #fff; text-shadow: var(--stroke); cursor: pointer; border: 3px solid transparent; border-radius: 14px; min-height: 54px; padding: 6px 16px; font-size: 20px; transition: transform .05s, box-shadow .05s; border-image-slice: 40 fill; border-image-width: 15px; border-image-repeat: stretch; }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--sh) !important; }
  .btn.blue { border-image-source: url(assets/ui/btn-blue.png); --sh: var(--blue2); box-shadow: 0 5px 0 var(--blue2); }
  .btn.green { border-image-source: url(assets/ui/btn-green.png); --sh: var(--green2); box-shadow: 0 5px 0 var(--green2); }
  .btn.red { border-image-source: url(assets/ui/btn-red.png); --sh: var(--red2); box-shadow: 0 5px 0 var(--red2); }
  .btn.gold { border-image-source: url(assets/ui/btn-gold.png); --sh: var(--gold2); color: #3a2a00; text-shadow: none; box-shadow: 0 5px 0 var(--gold2); }
  /* 회색은 Kenney 원본이 거의 흰색(밝기 218~255)이라 흰 글자가 안 읽힌다 — 노랑과 같이 어두운 글자를 쓴다 */
  .btn.gray { border-image-source: url(assets/ui/btn-gray.png); --sh: #666880; color: #39424A; text-shadow: none; box-shadow: 0 5px 0 #666880; }
  .btn:disabled { filter: grayscale(1) brightness(.75); cursor: default; }
  .rbtn { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 60px; background: none; border: 0; padding: 0; cursor: pointer; color: #fff; font: inherit; font-size: 13px; text-shadow: var(--stroke); position: relative; }
  .rbtn .circ { width: 52px; height: 52px; border-radius: 50%; background: var(--cream); border: 3px solid var(--brown); box-shadow: 0 3px 0 var(--brown2), 0 5px 10px rgba(0,0,0,.3); display: flex; align-items: center; justify-content: center; color: var(--brown); font-size: 26px; transition: transform .05s; }
  .rbtn:active .circ { transform: translateY(3px); box-shadow: 0 0 0 var(--brown2); }
  .rbtn .dot { position: absolute; top: -2px; right: 4px; width: 14px; height: 14px; border-radius: 50%; background: #FF3B30; border: 2px solid #fff; }

  /* ---------- 메뉴·지도·덱·기록·설정 화면 (3D 위에 얹히는 오버레이) ---------- */
  .overlay { position: fixed; inset: 0; z-index: 20; color: #fff; padding: calc(12px + env(safe-area-inset-top)) 14px calc(14px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; animation: screenIn .28s cubic-bezier(.2,.8,.2,1); }
  @keyframes screenIn { from { opacity: 0; transform: translateY(14px) scale(.985); } to { opacity: 1; transform: none; } }
  #toast, #nextDetail { animation: popIn .18s cubic-bezier(.2,.9,.3,1.2); }
  @keyframes popIn { from { opacity: 0; transform: translate(-50%, -100%) scale(.85); } }

    /* 높이는 buildWorld() 가 판 수 × 126px 로 직접 정한다 — 폭에 비례시키면 좁은 폰에서 칸이 겹친다 */

  .node .circ { width: 58px; height: 58px; border-radius: 50%; background: var(--cream); border: 3px solid var(--brown); box-shadow: 0 4px 0 var(--brown2), 0 6px 12px rgba(0,0,0,.35); display: flex; align-items: center; justify-content: center; font-size: 24px; color: var(--ink); text-shadow: none; transition: transform .05s; }

  /* 🛑 nowrap 이면 「칸마다 타워 시작 단계 한 단 위에서 시작」 같은 긴 효과 문구가 실기기(360px)에서 화면 밖 34px 로 삐져나간다
     (2026-09-07 실측). 오른쪽에 붙이되 줄은 접히게 둔다 — flex 칸은 min-width:0 이라야 실제로 접힌다. */

  .branch .steps { display: grid; grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); gap: 8px; margin-top: 8px; } /* 공격 10칸은 폰 폭을 넘쳐 두 줄로 */

  /* ---------- 게임 화면 (2026-09-06 참고: 레이드 러시 — 상단 얇은 한 줄, 하단은 낮게, 카드는 3D 그림) ----------
     상단: [←] · 웨이브 진행 막대(칸이 채워진다 + N/M) · [⏸] · 우측에 생명·골드 작은 알약 두 줄. 막대 아래 카운트다운 줄(웨이브 사이에만: "다음 8초" + 적 아이콘), 그 아래 보스 체력 막대(보스가 살아 있을 때만). 자세한 예고는 막대를 누르면 펼쳐진다.
     하단: 판 아래 빈 땅에 카드 한 줄(그림 + 값, 이름은 고르면 뜬다) + 오른쪽 큰 ▶. 실측 숫자는 docs/checklist.md F1. */
  #hud { position: fixed; top: calc(6px + env(safe-area-inset-top)); left: 6px; right: 6px; z-index: 10; display: flex; gap: 6px; align-items: flex-start; pointer-events: none; }
  #hud > * { pointer-events: auto; }
  .ibtn { width: 40px; height: 40px; border-radius: 50%; background: rgba(20,26,34,.55); border: 2px solid rgba(255,255,255,.55); color: #fff; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer; flex: 0 0 auto; box-shadow: 0 2px 6px rgba(0,0,0,.35); }
  .ibtn svg { width: 22px; height: 22px; }
  /* 배속(위 정보줄) — 지금 몇 배인지 숫자로. 1× 가 아니면 금색으로 도드라진다 */
  #speedBtn { font: inherit; font-family: var(--f-title); font-weight: 400; font-size: 15px; color: #fff; }
  #speedBtn.fast { background: var(--gold); border-color: #fff; color: #3a2a00; }
  .ibtn:active { transform: translateY(2px); }
  #waveBar { flex: 1; min-width: 0; margin-top: 2px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; }
  #waveBar .track { width: 100%; height: 22px; border-radius: 12px; background: rgba(20,26,34,.6); border: 2px solid rgba(255,255,255,.5); position: relative; overflow: hidden; }
  #waveBar .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: linear-gradient(#8CE86A, #46B83A); transition: width .4s; }
  #waveBar .ticks { position: absolute; inset: 0; background-image: repeating-linear-gradient(90deg, transparent 0, transparent calc(var(--seg) - 2px), rgba(0,0,0,.35) calc(var(--seg) - 2px), rgba(0,0,0,.35) var(--seg)); }
  #waveBar .num { position: absolute; right: 8px; top: 0; line-height: 18px; font-size: 15px; }
  /* 카운트다운 줄(웨이브 사이): 막대 아래 한 줄. 글자 규칙 1(2026-09-06): 3D 위 글자는 반드시 어두운 판(불투명도 .72) + 흰 글자 — 전엔 노란 맨글자라 밝은 잔디 위에서 안 읽혔다 */
  #waveBar .cd { display: flex; gap: 6px; align-items: center; height: 22px; max-width: 100%; overflow: hidden; color: #fff; font-size: 15px; white-space: nowrap; animation: fadeIn .25s; }
  .dk { background: rgba(20,26,34,.72); border-radius: 999px; padding: 0 9px; line-height: 22px; color: #fff; }
  #waveBar .cd .sec { flex: 0 0 auto; font-variant-numeric: tabular-nums; }
  #waveBar .cd .sec.soon { animation: cdPulse .5s ease-in-out infinite alternate; border: 2px solid #fff; line-height: 18px; } /* 3초 전부터 "!" + 커지는 펄스 + 흰 테두리(색만으로 알리지 않는다) */
  #waveBar .cdfoes.dk { padding: 0 6px; }
  @keyframes cdPulse { from { transform: scale(1); } to { transform: scale(1.12); } }
  /* 높이를 16px 로 묶어 두어 적 아이콘·성질 칩 위아래가 3px 잘렸다(2026-09-07 360x780 실측) — 줄 높이(22px)에 맞춘다 */
  #waveBar .cdfoes { display: inline-flex; gap: 1px; align-items: center; height: 22px; min-width: 0; overflow: hidden; }
  /* 🔴 2026-09-08: 적 아이콘이 자리를 다 먹어 「+2」와 보스 칩이 잘려 나갔다(실측 55px 넘침).
     줄어들 수 있는 것은 **아이콘 줄뿐**이고, 「+N」과 성질 칩은 절대 안 줄인다 — 그게 정보다. */
  #waveBar .cdfoes .foes { display: inline-flex; gap: 1px; align-items: center; min-width: 0; }
  #waveBar .cdfoes .faces { display: inline-flex; gap: 1px; align-items: center; flex: 0 1 auto; min-width: 0; overflow: hidden; }
  #waveBar .cdfoes .more, #waveBar .cdfoes .spc, #waveBar .cdfoes .foes > svg { flex: 0 0 auto; }
  #waveBar .cdfoes svg { width: 15px; height: 15px; flex: 0 0 auto; }
  #waveBar .cdfoes .more { font-size: 13px; }
  #waveBar .cdfoes .spc { font-size: 13px; line-height: 1.3; padding: 0 5px; margin-left: 3px; }
  #waveBar .cdfoes .spc.boss { background: #B02A3A; border: 1px solid #FF8080; }
  /* 보스 체력 막대: HUD 아래 한 줄(높이 20px), 알약 열(오른쪽 92px)을 피해서. 두꺼운 테두리 + 붉은 채움 + 깎일 때 흰 번쩍 */
  #bossBar { position: fixed; top: calc(52px + env(safe-area-inset-top)); left: 52px; right: 92px; z-index: 10; display: flex; align-items: center; gap: 6px; pointer-events: none; color: #fff; text-shadow: var(--stroke); font-size: 13px; animation: fadeIn .3s; }
  #bossBar .nm { flex: 0 0 auto; color: #FF8080; }
  #bossBar .track { flex: 1; height: 16px; border-radius: 8px; background: rgba(20,10,12,.7); border: 3px solid #FFD0D0; box-shadow: 0 0 0 2px #7A1020, 0 2px 8px rgba(0,0,0,.5); position: relative; overflow: hidden; }
  #bossBar .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; background: linear-gradient(#FF6A5E, #C0202A); transition: width .15s; }
  #bossBar .glint { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
  #bossBar.flash .glint { animation: bossFlash .18s ease-out; }
  @keyframes bossFlash { 0% { opacity: .85; } 100% { opacity: 0; } }
  #bossBar .pct { flex: 0 0 38px; text-align: right; font-variant-numeric: tabular-nums; }
  /* 성이 맞았을 때: 생명 알약이 크게 튀며 붉게 + "−N" 플로터 · 화면 가장자리 붉은 번쩍 */
  #lifePill { position: relative; }
  #lifePill.hit { animation: lifeHit .5s ease-out; border-color: #FF6060; background: rgba(120,16,20,.8); }
  @keyframes lifeHit { 0% { transform: scale(1); } 30% { transform: scale(1.45); } 100% { transform: scale(1); } }
  #lifePill .lf { position: absolute; left: -8px; top: 50%; transform: translate(-100%, -50%); font-size: 20px; color: #FF6060; text-shadow: var(--stroke); pointer-events: none; animation: lifeFl .9s ease-out forwards; }
  @keyframes lifeFl { 0% { opacity: 1; transform: translate(-100%, -50%) scale(.8); } 30% { transform: translate(-100%, -70%) scale(1.25); } 100% { opacity: 0; transform: translate(-100%, -160%) scale(1); } }
  #dmgFlash { position: fixed; inset: 0; z-index: 8; pointer-events: none; opacity: 0; background: radial-gradient(ellipse at center, rgba(255,40,40,0) 55%, rgba(255,40,40,.55) 100%); }
  #dmgFlash.on { animation: dmgFlash .35s ease-out; }
  @keyframes dmgFlash { 0% { opacity: 1; } 100% { opacity: 0; } }
  #danger { position: fixed; inset: 0; z-index: 8; pointer-events: none; background: radial-gradient(ellipse at center, rgba(255,40,40,0) 60%, rgba(255,40,40,.45) 100%); animation: dangerPulse 1.1s ease-in-out infinite alternate; }
  @keyframes dangerPulse { from { opacity: .15; } to { opacity: .8; } }
  /* 일시정지 오버레이(게임 화면 안에만 — 메뉴·결과에선 #game 이 숨겨져 같이 숨는다) */
  #pauseOverlay { position: fixed; inset: 0; z-index: 35; background: rgba(8,12,18,.66); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; animation: fadeIn .2s; }
  #pauseOverlay .ptitle { font-size: 44px; color: #fff; text-shadow: var(--stroke), 0 6px 0 rgba(0,0,0,.4); }
  #pauseOverlay .prow { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  #pauseOverlay .btn.big { min-width: 220px; }
  .mpill { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px 1px 5px; border-radius: 999px; background: rgba(20,26,34,.6); border: 2px solid rgba(255,255,255,.5); font-size: 15px; white-space: nowrap; color: #fff; min-width: 74px; justify-content: flex-start; }
  .mpill svg.i { font-size: 16px; }
  .mpill .num { text-shadow: none; }
  #hudRight { display: flex; flex-direction: column; gap: 4px; align-items: flex-end; }
  #bagPill.has { border-color: var(--gold); box-shadow: 0 0 0 2px rgba(255,201,60,.5); animation: glowPulse 1s ease-in-out infinite alternate; }
  #nextDetail { position: fixed; top: calc(74px + env(safe-area-inset-top)); left: 52px; right: 92px; z-index: 10; padding: 8px 10px; font-size: 13px; display: flex; flex-wrap: wrap; gap: 4px 10px; }
  /* 하단 한 줄: [돌리기] [카드…] [▶]. 카드 = 타워 그림 + 값. 이름은 고른 카드 위에만 뜬다(글자 최소) */
  /* 🔴 2026-09-08 (사장님 "이거 타워선택과 겹친다고 몇번얘기해"):
     되돌리기 · 카드줄 · ▶버튼이 **한 줄**에 있고 사이가 6px 뿐이었다(실측: 카드줄 52~288, 버튼 294~354).
     카드가 늘어나면 카드줄이 288에서 잘려 **마지막 카드가 반쪽으로 버튼에 딱 붙는다** —
     보기에 겹치고, 손가락(≈45px)으로 그 카드를 누르려다 ▶ 를 누른다.
     🔑 같은 줄에 두는 한 계속 부딪힌다 → ▶ 를 **줄에서 빼내 카드줄 위 오른쪽**으로 올린다.
        카드줄은 화면 폭을 다 쓰게 되고(카드가 더 보인다), 버튼은 절대 안 겹친다. */
  #bottom { position: fixed; left: 6px; right: 6px; bottom: calc(8px + env(safe-area-inset-bottom)); z-index: 10; display: flex; gap: 14px; align-items: flex-end; pointer-events: none; }
  #bottom > * { pointer-events: auto; }
  /* 오른쪽 끝 14px 을 흐리게 — 카드가 많아 잘릴 때 「반쪽 카드」가 아니라 자연스럽게 사라진다.
     🛑 overflow-y 는 visible 이어야 카드 위 이름표·삼각형이 안 잘린다 → mask 는 가로만 건다. */
  /* 🔑 안쪽 여백을 14px 로 주고 **같은 14px** 을 양끝에서 흐리게 한다.
     안 밀었을 때는 첫·마지막 카드가 여백 뒤(=흐림 밖)에 있어 멀쩡하고,
     밀어서 카드가 끝을 넘어가면 그 흐림 위로 지나가며 자연스럽게 사라진다. */
  #towerBar { flex: 1; min-width: 0; display: flex; gap: 8px; overflow-x: auto; overflow-y: visible; padding: 12px 14px 0; scrollbar-width: none; -webkit-overflow-scrolling: touch;
    -webkit-mask-image: linear-gradient(to right, transparent 0, #000 14px, #000 calc(100% - 14px), transparent 100%);
    mask-image: linear-gradient(to right, transparent 0, #000 14px, #000 calc(100% - 14px), transparent 100%); }
  #towerBar::-webkit-scrollbar { display: none; }
  .tcard { flex: 0 0 60px; height: 70px; position: relative; border-radius: 12px; border: 2px solid rgba(255,255,255,.7); box-shadow: 0 3px 0 rgba(0,0,0,.35), inset 0 -14px 0 rgba(0,0,0,.18); display: flex; flex-direction: column; align-items: center; justify-content: flex-end; cursor: pointer; padding: 0 0 3px; font: inherit; color: #fff; text-shadow: var(--stroke); transition: transform .05s; overflow: visible; }
  .tcard:active { transform: translateY(2px); }
  .tcard .art { position: absolute; left: 0; right: 0; top: -10px; height: 56px; display: flex; align-items: flex-end; justify-content: center; pointer-events: none; }
  .tcard .art img { width: 58px; height: 58px; filter: drop-shadow(0 3px 2px rgba(0,0,0,.45)); }
  .tcard .art svg { width: 30px; height: 30px; display: block; margin-bottom: 10px; }
  .tcard .pr { font-size: 13px; background: rgba(20,26,34,.72); border-radius: 999px; padding: 0 7px; color: var(--gold); display: inline-flex; align-items: center; gap: 2px; line-height: 18px; }
  .tcard .pr svg { width: 12px; height: 12px; }
  .tcard.poor { filter: grayscale(1) brightness(.65); }
  .tcard.poor .pr { color: #fff; } /* 골드 부족: 회색 + 자물쇠 아이콘(색만으로 알리지 않는다) */
  .tcard.sel { border-color: #fff; box-shadow: 0 0 0 3px var(--green), 0 3px 0 rgba(0,0,0,.35); transform: translateY(-6px); }
  .tcard.sel .nm { display: block; }
  .tcard .nm { display: none; position: absolute; bottom: 22px; left: 0; right: 0; text-align: center; font-size: 13px; line-height: 1; white-space: nowrap; }
  .tcard .aff { position: absolute; top: -6px; left: -5px; width: 20px; height: 20px; border-radius: 50%; border: 2px solid #fff; display: flex; align-items: center; justify-content: center; }
  .tcard .aff svg { width: 12px; height: 12px; }
  .tcard .aff.up { background: var(--green2); } .tcard .aff.down { background: var(--red2); }
  .tcard .bt { position: absolute; top: -6px; right: -5px; font-size: 13px; background: var(--gold); color: #3a2a00; text-shadow: none; border: 2px solid #fff; border-radius: 999px; padding: 0 5px; line-height: 14px; }
  /* 🛑 카드줄 **위**로 올려도 봤는데 그러면 성(출구)을 가린다 — 출구는 가리면 안 된다. 같은 줄에 둔다.
     대신 ⑴사이를 6 → 14px 로 벌리고 ⑵카드줄 오른쪽 끝을 흐리게(mask) 해서
     잘린 카드가 버튼에 **딱 붙어 보이지 않게** 한다. 잘린 카드가 반쪽으로 버튼에 붙던 것이 지적의 핵심이었다. */
  #waveBtn { width: 60px; height: 60px; border-radius: 50%; padding: 0; min-height: 0; flex: 0 0 auto; font-size: 20px; border-width: 3px; position: relative; }
  #waveBtn svg { width: 34px; height: 34px; }
  #waveBtn.running { background: #6B7C86; border-color: #3E4A52; --sh: #3E4A52; box-shadow: 0 5px 0 #3E4A52; }
  #waveBtn .spd { position: absolute; bottom: -6px; right: -4px; background: var(--gold); color: #3a2a00; text-shadow: none; border: 2px solid #fff; border-radius: 999px; font-size: 13px; line-height: 14px; padding: 0 5px; }
  /* 카운트다운 중 ▶ = 「미리 부르기」: 지금 누르면 받을 보너스 골드 칩("+N", 초마다 줄어든다) */
  #waveBtn .bonus { position: absolute; top: -8px; right: -6px; background: var(--gold); color: #3a2a00; text-shadow: none; border: 2px solid #fff; border-radius: 999px; font-size: 13px; line-height: 14px; padding: 0 5px; display: inline-flex; align-items: center; gap: 1px; font-variant-numeric: tabular-nums; }
  #waveBtn .bonus svg { width: 10px; height: 10px; }
  #rotateBtn { margin-bottom: 12px; }
  /* 타워 팝(승급·팔기·숫자) — 2026-09-06 화면 설계 2판: 화면 아래 카드 줄 바로 위에 고정. 타워 위에 띄우던 것은 타워를 다시 누르려다 [팔기]를 누르게 했다.
     [승급]은 크게 가운데, [팔기]는 작고 회색으로 왼쪽 구석(승급과 멀리), 누르면 확인 줄로 바뀐다 */
  #pop { position: fixed; z-index: 12; left: 6px; right: 6px; bottom: calc(100px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; }
  #pop > * { pointer-events: auto; }
  #pop .row { display: flex; gap: 10px; justify-content: center; width: 100%; max-width: 360px; }
  #pop .row.side { justify-content: space-between; gap: 6px; }
  #pop .row.side .grow { flex: 1; }
  #pop .btn { min-height: 54px; padding: 3px 18px; font-size: 20px; flex-direction: column; gap: 0; line-height: 1.1; white-space: nowrap; flex: 1; max-width: 220px; }
  #pop .btn small { font-size: 13px; opacity: .95; }
  #pop .btn.tiny { min-height: 34px; font-size: 13px; padding: 0 10px; flex: 0 0 auto; border-radius: 10px; flex-direction: row; gap: 4px; max-width: none; }
  #pop .btn.tiny.sell { opacity: .8; }
  /* 「정말 파나요?」 확인 창 — 이것도 판이라 그림 테두리를 씌운다(K-2-4). 작은 조각(카드·알약·도장)은 일부러 안 씌운다: 큰 판에만 장식이 붙어야 위계가 생긴다 */
  #pop .row.confirm { background: var(--cream); border: 3px solid transparent; border-radius: 14px; border-image: var(--ui-frame) 32 stretch; border-image-width: 16px; padding: 8px 10px; align-items: center; gap: 8px; box-shadow: 0 4px 0 var(--brown2); }
  #pop .row.confirm .q { flex: 1; font-size: 15px; line-height: 1.3; white-space: normal; }
  #pop .row.confirm .btn { flex: 0 0 auto; min-height: 44px; font-size: 15px; padding: 3px 12px; flex-direction: row; gap: 4px; }
  #pop .title { padding: 3px 12px; font-size: 15px; white-space: nowrap; }
  #pop .title b { font-size: 15px; }
  #pop .detail { padding: 6px 10px; font-size: 13px; color: var(--ink2); max-width: 340px; text-align: center; line-height: 1.4; }
  #pop .lvl { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink2); padding: 0 10px 4px; }
  #pop .xp { width: 110px; height: 8px; background: rgba(0,0,0,.15); border-radius: 4px; overflow: hidden; }
  #pop .xp span { display: block; height: 100%; background: var(--green); }
  /* 3단 갈래 버튼(화력/광역) — 색은 balance.json 의 갈래 색을 인라인으로 */
  #pop .btn.brn { min-width: 96px; box-shadow: 0 5px 0 rgba(0,0,0,.35), 0 7px 12px rgba(0,0,0,.3); font-size: 15px; }
  /* 🔴 2026-09-08 (사장님 사진): 여기 white-space: nowrap 때문에 갈래 설명이 **한 줄로 강제**돼
     버튼 밖으로 삐져나가 옆 버튼 글자와 겹쳤다. 「사거사거리)+5%」처럼 보이던 것이 두 글이 포개진 것이다.
     이제 줄바꿈을 허용하고, 어떤 글이 와도 버튼을 넘지 못하게 막는다. */
  #pop .btn.brn { flex: 1 1 0; min-width: 0; max-width: 100%; overflow: hidden; }
  #pop .btn.brn small { display: block; width: 100%; font-size: 12.5px; line-height: 1.3; text-shadow: var(--stroke-thin);
    white-space: normal; overflow-wrap: anywhere; word-break: keep-all; }
  /* 적 성질·갈래 칩 */
  .spc { display: inline-block; padding: 0 8px; border-radius: 999px; color: #fff; text-shadow: var(--stroke); font-size: 13px; line-height: 1.5; vertical-align: middle; white-space: nowrap; flex-shrink: 0; }
  /* 예고 줄이 폰 폭을 넘치면 적 아이콘 줄만 줄어든다 — 글자("다음"·성질 칩)는 꺾이지 않는다 */
  .spc.big { font-size: 20px; padding: 2px 16px; }
  #banner .spcline { margin-top: 6px; }
  #banner .foes { display: inline-flex; gap: 2px; align-items: center; margin-top: 4px; } #banner .foes svg { width: 26px; height: 26px; } #banner .foes .more { font-size: 20px; }
  /* 아이템 칸(타워당 3칸)과 가방 */
  #pop .islots, #pop .bag { display: flex; gap: 6px; padding: 5px 8px; flex-wrap: wrap; justify-content: center; max-width: 320px; }
  .islot { min-width: 58px; min-height: 34px; border-radius: 8px; border: 2px dashed var(--brown); background: rgba(0,0,0,.06); font: inherit; font-size: 13px; color: var(--ink2); cursor: pointer; padding: 2px 6px; display: flex; flex-direction: column; align-items: center; line-height: 1.1; }
  .islot small { font-size: 13px; color: var(--ink2); }
  .islot.on { border-style: solid; background: #fff; color: var(--ink); }
  .islot.g-uncommon { border-color: var(--green2); } .islot.g-rare { border-color: var(--blue2); } .islot.g-unique { border-color: var(--gold2); background: #FFF3C4; }
  #bagPill.has { border-color: var(--gold2); box-shadow: 0 0 0 3px rgba(255,201,60,.55), 0 3px 0 var(--brown2); animation: glowPulse 1s ease-in-out infinite alternate; }
  .fl.item { color: #FFD34D; font-size: 20px; animation-duration: 1.55s; }
  /* 피해 숫자·안내 */
  #floaters { position: fixed; inset: 0; z-index: 9; pointer-events: none; overflow: hidden; }
  /* 피해·처치·골드 숫자: 글자 규칙 1 — 3D 위 글자엔 어두운 판(.72) + 흰 글자. 큰 피해는 20px + 주황 테두리, 골드는 동전 아이콘(색만으로 구분하지 않는다) */
  .fl { position: absolute; transform: translate(-50%, -50%); font-size: 15px; color: #fff; background: rgba(20,26,34,.72); border-radius: 999px; padding: 0 7px; line-height: 20px; animation: fl .8s ease-out forwards; will-change: transform, opacity; white-space: nowrap; }
  .fl.big { font-size: 20px; line-height: 24px; border: 2px solid #FF7A3D; }
  .fl.kill { border: 2px solid #7CE76A; }
  .fl.gold { color: var(--gold); font-size: 15px; display: inline-flex; align-items: center; gap: 2px; } /* 처치 골드 "+12" — 동전 아이콘 앞에 */
  .fl.gold svg { width: 13px; height: 13px; }
  @keyframes fl { 0% { opacity: 1; transform: translate(-50%, -50%) scale(.7); } 25% { transform: translate(-50%, -80%) scale(1.15); } 100% { opacity: 0; transform: translate(-50%, -140%) scale(1); } }
  #hint { position: fixed; z-index: 11; transform: translate(-50%, -100%); display: flex; flex-direction: column; align-items: center; gap: 4px; pointer-events: none; }
  #hint .arrow { width: 0; height: 0; border-left: 22px solid transparent; border-right: 22px solid transparent; border-top: 34px solid var(--gold); filter: drop-shadow(0 3px 0 var(--gold2)); animation: bob .8s ease-in-out infinite alternate; }
  #hint .txt { padding: 4px 12px; font-size: 15px; }
  @keyframes bob { from { transform: translateY(0); } to { transform: translateY(-10px); } }
  #banner { position: fixed; left: 0; right: 0; top: 34%; z-index: 30; text-align: center; font-size: 40px; color: #fff; text-shadow: var(--stroke), 0 6px 0 rgba(0,0,0,.4); pointer-events: none; animation: banner 1.6s ease-out forwards; }
  @keyframes banner { 0% { opacity: 0; transform: translateX(-60px) scale(.8); } 15% { opacity: 1; transform: translateX(0) scale(1.05); } 80% { opacity: 1; transform: translateX(0) scale(1); } 100% { opacity: 0; transform: translateX(60px); } }
  /* 배너 변형: boss = 보스 등장(더 크고 붉은 빛) · gold = 보스 처치(금색) · small = 웨이브 클리어(28px, 판을 덜 가린다) */
  #banner.boss { font-size: 52px; color: #FF7070; text-shadow: var(--stroke), 0 0 18px rgba(255,40,40,.9), 0 0 40px rgba(255,0,0,.6), 0 6px 0 rgba(0,0,0,.4); animation: bannerBoss 2s ease-out forwards; }
  @keyframes bannerBoss { 0% { opacity: 0; transform: scale(2.2); } 12% { opacity: 1; transform: scale(1); } 80% { opacity: 1; transform: scale(1.04); } 100% { opacity: 0; transform: scale(1.1); } }
  #banner.gold { color: var(--gold); text-shadow: var(--stroke), 0 0 18px rgba(255,201,60,.8), 0 6px 0 rgba(0,0,0,.4); }
  #banner.small { font-size: 28px; }
  #banner .bt, #banner .sub { background: rgba(20,26,34,.72); border-radius: 14px; padding: 2px 16px; } /* 글자 규칙 1: 배너도 어두운 판 위에 */
  #banner .sub { font-size: 20px; margin-top: 4px; color: var(--gold); display: inline-flex; align-items: center; gap: 4px; }
  #banner .sub svg { width: 20px; height: 20px; }
  #banner .sub.leak { color: #FF8080; }
  #toast { position: fixed; left: 50%; top: 42%; transform: translateX(-50%); z-index: 30; padding: 8px 16px; font-size: 15px; pointer-events: none; max-width: 90vw; text-align: center; }
  .bump { animation: bump .35s ease-out; }
  @keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.35); } 100% { transform: scale(1); } }

  /* ---------- 끝 화면 ---------- */
  #endScreen { position: fixed; inset: 0; z-index: 25; background: rgba(10,16,24,.88); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; gap: 12px; color: #fff; animation: fadeIn .3s; }
  #endScreen h1 { margin: 0; font-size: 30px; text-shadow: var(--stroke); }
  #endScreen .panel { padding: 16px 20px; font-size: 15px; line-height: 1.5; min-width: 260px; max-width: 360px; }
  /* 결과 화면 (checklist K-2-16): 문장 한 덩어리 대신 칩으로. 위계는 ⑴얼마나 갔나 → ⑵무엇을 받았나 → ⑶다음에 뭘 할까.
     🛑 결과 패널은 크림 바탕이라 칩도 크림 위에서 읽히는 색으로 짠다 */
  .rrow { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 4px 0; }
  .rchip { display: inline-flex; align-items: center; gap: 4px; background: rgba(107,74,43,.1); border: 2px solid rgba(107,74,43,.3); border-radius: 999px; padding: 4px 12px; font-size: 15px; color: var(--ink); white-space: nowrap; }
  .rchip svg { width: 16px; height: 16px; }
  .rchip.gold { background: #FFF3C4; border-color: var(--gold2); color: #5a3d00; }
  .rchip.best { background: rgba(22,187,119,.2); border-color: var(--green2); color: var(--green2); }
  .rchip.open { background: rgba(28,159,215,.16); border-color: var(--blue2); color: var(--blue2); }
  /* 다음 목표 한 줄 — 진 화면에서 「별 없음」이라고 통보하는 대신 「어떻게 하면 받나」를 보여 준다 */
  .rgoal { display: flex; align-items: center; justify-content: center; gap: 4px; margin-top: 8px; font-size: 13px; color: var(--ink2); }
  .rgoal svg { width: 18px; height: 18px; }
  #ticketLines { text-align: left; font-size: 15px; }
  #endScreen .btn { min-width: 140px; }
  #endBtns { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  /* 별이 하나씩 튀어나온다 */
  .endStars { display: flex; gap: 10px; height: 72px; align-items: center; }
  .endStars svg { width: 66px; height: 66px; opacity: .3; filter: grayscale(1) brightness(.7); }
  .endStars svg.on { opacity: 1; filter: drop-shadow(0 0 10px rgba(255,201,60,.8)); animation: starPop .55s cubic-bezier(.2,1.5,.4,1) both; }
  @keyframes starPop { 0% { transform: scale(0) rotate(-40deg); opacity: 0; } 60% { transform: scale(1.35) rotate(6deg); opacity: 1; } 100% { transform: scale(1) rotate(0); opacity: 1; } }
  .newBest { display: inline-flex; align-items: center; gap: 4px; background: var(--gold); color: #3a2a00; padding: 4px 12px; border-radius: 999px; font-size: 15px; margin: 4px 0; animation: revealPop .4s 1.5s both; }
  @keyframes revealPop { 0% { opacity: 0; transform: scale(.4); } 70% { transform: scale(1.15); } 100% { opacity: 1; transform: none; } }

  /* ---------- 뽑기 화면 ---------- */
  #gachaScreen { position: fixed; inset: 0; z-index: 40; background: radial-gradient(ellipse at 50% 35%, #2b3f5a, #0E1410 70%); display: flex; flex-direction: column; align-items: center; padding: calc(12px + env(safe-area-inset-top)) 14px calc(14px + env(safe-area-inset-bottom)); overflow-y: auto; color: #fff; }
  .gacha-head { width: 100%; max-width: 560px; display: flex; align-items: center; gap: 12px; }
  .gacha-head h1 { margin: 0; font-size: 26px; flex: 1; text-shadow: var(--stroke); }
  #ticketCount { font-size: 20px; }
  /* 카드 칸 (checklist K-2-14): 전에는 높이 400px 고정이라 화면이 짧은 실기기(360×780)에서 카드 내용이 밖으로 넘쳐
     [1장 뽑기] 버튼 뒤로 잘려 들어갔다(사장님 실기기 캡처). 이제 화면 높이를 따라 줄고, 넘칠 일이 없게 안쪽을 잘라낸다.
     🛑 flex: 0 0 auto 를 빼면 안 된다 — 이 칸은 세로 flex 안의 한 칸이라, 내용을 줄이자마자
        높이가 눌려 카드 그림이 납작하게 잘렸다(2026-09-07 실측). */
  #gachaStage { position: relative; flex: 0 0 auto; width: 270px; max-width: 78vw; height: min(330px, 40vh); margin: 16px 0 12px; perspective: 900px; }
  .card3d { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform .6s cubic-bezier(.2,.8,.2,1); --grade: #9BA3A8; }
  .card3d.flip { transform: rotateY(180deg); }
  .card3d .face { position: absolute; inset: 0; border-radius: 16px; backface-visibility: hidden; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 12px 14px; text-align: center; }
  .card3d .back { background: linear-gradient(135deg, #3a4a60, #1b2430); border: 3px solid var(--brown); font-size: 64px; color: #9BA3A8; }
  .card3d .front { transform: rotateY(180deg); background: linear-gradient(160deg, #1d242c, #0f1418); border: 3px solid var(--grade); box-shadow: 0 0 24px var(--grade), inset 0 0 40px rgba(255,255,255,.04); justify-content: flex-start; }
  .card3d.flip .front { animation: glow 1.2s ease-out; }
  .card3d .front .grade { font-size: 15px; letter-spacing: .12em; color: var(--grade); background: rgba(0,0,0,.35); border-radius: 999px; padding: 0 12px; line-height: 22px; }
  .card3d .front .art { width: 150px; height: 150px; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: radial-gradient(circle at 50% 45%, rgba(255,255,255,.18), rgba(0,0,0,0) 70%); }
  .card3d .front .art img { width: 150px; height: 150px; filter: drop-shadow(0 4px 3px rgba(0,0,0,.5)); }
  .card3d .front .art canvas { display: block; }
  .card3d .front .art .ro svg { width: 70px; height: 70px; }
  .card3d .front .name { font-size: 20px; line-height: 1.25; text-shadow: var(--stroke); }
  .card3d .front .tags { display: flex; gap: 4px; justify-content: center; flex-wrap: wrap; }
  .card3d .front .badge .new { display: inline-block; background: var(--green); color: #fff; text-shadow: var(--stroke); border-radius: 999px; padding: 0 12px; font-size: 15px; line-height: 24px; animation: revealPop .4s .5s both; }

  .gbtn.locked { filter: grayscale(1) brightness(.85); }
  .gbtn .dot { position: absolute; top: -4px; right: -4px; width: 15px; height: 15px; border-radius: 50%; background: #FF3B30; border: 2px solid #fff; box-shadow: 0 0 0 1px #7A1020; }
  .gbtn .badge { position: static; transform: none; background: var(--cream2); color: var(--ink2); border-radius: 999px; padding: 0 5px; font-size: 10px; line-height: 15px; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
  /* 가운데 주인공: 다음에 갈 스테이지 */
  .stage-main { display: flex; flex-direction: column; align-items: center; gap: var(--sp1); min-width: 0; color: #fff; text-align: center; }
  .stage-main .sno { font-family: var(--f-title); font-weight: 400; font-size: 15px; background: rgba(20,26,34,.72); border-radius: 999px; padding: 0 var(--sp3); line-height: 26px; }
  .stage-main .snm { font-family: var(--f-title); font-weight: 400; font-size: 28px; -webkit-text-stroke: 0.055em #000; paint-order: stroke fill; }
  /* 별은 난이도마다 한 줄(보통=금 · 어려움=붉은) — 월드맵의 점과 같은 규칙. 여섯 개를 한 줄로 늘어놓으면 무슨 뜻인지 안 보인다 */
  /* 별 줄도 어두운 판 위에 올린다 — 「글자 규칙 1」(3D 위에 얹히는 것은 어두운 판 + 밝은 그림)과 같은 이유다.
     3D 담당이 스테이지 모형을 배경 캔버스에 그리는 바람에 별이 모형의 밝은 면과 겹쳐 읽히지 않았다(2026-09-07 실측). */
  .stage-main .sst { display: flex; flex-direction: column; align-items: center; gap: 0; background: rgba(20,26,34,.6); border-radius: 999px; padding: 4px 8px; }
  .stage-main .sst .srow { display: flex; line-height: 0; }
  /* 🛑 아직 안 딴 별은 회색(#4A4F55)이라 배경이 어두운 단색 하늘이면 통째로 묻혀 사라진다(2026-09-07 실측 — 로비 배경이 3D 판에서 하늘로 바뀔 예정).
     "이 스테이지에 별이 몇 개 있나"는 어느 배경에서든 보여야 하므로 흰 윤곽을 둘러 형태를 남긴다. */
  .stage-main .sst svg { width: 22px; height: 22px; filter: drop-shadow(0 0 1.5px rgba(255,255,255,.9)); }
  /* 🛑 다음 스테이지의 작은 3D 모형 자리 — checklist K-2-8 은 3D 담당 몫이다. 화면 담당은 크기·자리만 잡고 비워 둔다.
     비어 있어도 화면이 무너지지 않게 최소 높이만 준다 */
  #lobbyStage3D { width: 100%; max-width: 210px; height: min(210px, 26vh); margin: 0 auto; }
  /* ---------- 전용 페이지(출석·일일 미션) 머리 ---------- */
  .sheet-head { display: flex; align-items: center; gap: var(--sp3); margin-bottom: var(--sp3); }
  .sheet-head h2 { flex: 1; min-width: 0; }
  .xbtn { width: 46px; height: 46px; flex: 0 0 auto; border-radius: 50%; background: var(--cream); border: 3px solid var(--brown); box-shadow: 0 3px 0 var(--brown2); color: var(--brown2); display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer; }
  .xbtn svg { width: 24px; height: 24px; }
  .xbtn:active { transform: translateY(3px); box-shadow: 0 0 0 var(--brown2); }
  /* 「일일」 페이지 소제목 — 한 페이지에 오늘의 미션과 출석 두 덩이가 들어가니 어디부터 어디까지인지 표시가 필요하다 */
  .sec-head { display: flex; align-items: center; gap: 8px; margin: 24px 0 8px; font-size: 20px; color: #fff; text-shadow: var(--stroke); }
  .sec-head:first-child { margin-top: 0; }
  .sec-head svg { width: 22px; height: 22px; flex: 0 0 auto; }
  .sec-head small { font-size: 13px; color: #C3CFDD; margin-left: auto; text-shadow: none; text-align: right; line-height: 1.25; }
  /* 누적 진행바(K-2-9 ⑷): 미션을 깰 때마다 한 칸 차오르고 마지막 칸에서 보너스 상자가 열린다 */
  .mprog { padding: var(--sp3) var(--sp2) var(--sp2); position: relative; }
  .mprog .track { position: absolute; left: calc(var(--sp2) + 24px); right: calc(var(--sp2) + 24px); top: calc(var(--sp3) + 15px); height: 10px; border-radius: 999px; background: rgba(107,74,43,.25); overflow: hidden; }
  .mprog .track .fill { display: block; height: 100%; background: linear-gradient(#8CE86A, #46B83A); transition: width .4s; }
  .mprog .stops { position: relative; display: flex; justify-content: space-between; }
  .mprog .stop { width: 48px; display: flex; flex-direction: column; align-items: center; gap: var(--sp1); font-size: 13px; color: var(--ink2); }
  .mprog .stop .box { width: 40px; height: 40px; border-radius: 12px; border: 3px solid var(--brown); background: var(--cream2); display: flex; align-items: center; justify-content: center; }
  .mprog .stop .box svg { width: 22px; height: 22px; }
  .mprog .stop.on { color: var(--ink); }
  .mprog .stop.on .box { background: var(--gold); border-color: var(--gold2); }
  /* 미션 한 줄 = [보상 배지] [제목 + 채워지는 막대] [받기(초록) / 이동(금색)]. 손가락으로 누를 수 있게 64px (전에는 30px 짜리 글자 줄이었다) */
  .mission { display: flex; align-items: center; gap: var(--sp3); padding: var(--sp2); margin-bottom: var(--sp2); min-height: 64px; border-radius: 14px; border: 3px solid transparent; border-image: var(--ui-frame) 32 stretch; border-image-width: 14px; background: var(--cream); color: var(--ink); box-shadow: 0 4px 0 var(--brown2); }
  .mission:last-child { margin-bottom: 0; }
  .mission .mrw { flex: 0 0 auto; width: 52px; display: flex; flex-direction: column; align-items: center; gap: var(--sp1); font-size: 13px; }
  .mission .mrw svg { width: 30px; height: 30px; }
  .mission .mrw b { font-family: var(--f-title); font-weight: 400; font-size: 15px; }
  .mission .mbody { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: var(--sp1); }
  .mission .nm { font-size: 15px; line-height: 1.25; }
  .mission .bar { position: relative; height: 22px; border-radius: 999px; background: rgba(107,74,43,.2); border: 2px solid var(--brown); overflow: hidden; }
  .mission .bar .fill { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(#8CE86A, #46B83A); transition: width .4s; }
  .mission .bar .pct { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 13px; color: var(--ink); font-variant-numeric: tabular-nums; }
  .mission .mbtn { flex: 0 0 auto; min-width: 68px; min-height: 46px; font-size: 15px; padding: var(--sp1) var(--sp2); }
  .mission .mbtn.ok { display: inline-flex; align-items: center; justify-content: center; gap: var(--sp1); color: var(--green2); font-size: 13px; }
  .mission .mbtn.ok svg { width: 18px; height: 18px; }
  .mission.claimed { opacity: .74; }
  .mission.bonus { border-image-source: var(--ui-frame-gold); }
  /* 출석 7칸도 같은 격으로(K-2-9 ⑸) — 전에는 36px 짜리 작은 칸이었다 */
  .astamps { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--sp2); }
  .astamp { position: relative; min-height: 78px; border-radius: 14px; border: 3px solid var(--brown); background: var(--cream2); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--sp1); color: var(--ink2); font-size: 13px; box-shadow: 0 3px 0 var(--brown2); }
  .astamp b { font-family: var(--f-title); font-weight: 400; font-size: 15px; color: var(--ink); }
  .astamp .tk { display: inline-flex; align-items: center; gap: 4px; }
  .astamp .tk svg { width: 20px; height: 20px; }
  .astamp.done { background: var(--gold); border-color: var(--gold2); color: #3a2a00; }
  .astamp.done b { color: #3a2a00; }
  .astamp.today { box-shadow: 0 0 0 3px rgba(22,187,119,.8), 0 3px 0 var(--brown2); }
  .astamp .chk { position: absolute; top: var(--sp1); right: var(--sp1); color: var(--green2); }
  .astamp .chk svg { width: 16px; height: 16px; }
  /* ---------- 도감(J-11 ③) ---------- */
  #codexScreen .screen-head { margin-bottom: 8px; }
  .cx-note { padding: 8px 12px; font-size: 15px; line-height: 1.45; }
  .cx-note.small { font-size: 13px; color: var(--ink2); margin-top: 12px; }
  .cx-table { padding: 8px; overflow-x: auto; margin-top: 12px; }
  table.aff { border-collapse: separate; border-spacing: 2px; width: 100%; font-size: 13px; table-layout: fixed; }
  table.aff th { font-weight: 400; color: var(--ink); padding: 4px 0; white-space: nowrap; font-size: 13px; }
  table.aff col.first { width: 52px; }
  table.aff th .dsh { width: 11px; height: 11px; margin-right: 4px; vertical-align: -1px; }
  table.aff th.corner { color: var(--ink2); text-align: left; }
  table.aff td { text-align: center; border-radius: 8px; padding: 8px 0; color: #fff; text-shadow: var(--stroke); font-size: 13px; }
  table.aff td.up { background: var(--green); } table.aff td.down { background: var(--red); } table.aff td.even { background: #9AA3AA; }
  .dsh { display: inline-block; width: 14px; height: 14px; border-radius: 50%; border: 2px solid #222; vertical-align: -2px; margin-right: 4px; }
  .dsh.big { width: 20px; height: 20px; }
  .ak { display: inline-block; background: #4A5A68; color: #fff; text-shadow: var(--stroke); border-radius: 999px; padding: 0 8px; font-size: 13px; line-height: 1.6; white-space: nowrap; }
  .cx-list { padding: 8px 12px; font-size: 15px; margin-top: 12px; }
  .cx-row { display: flex; align-items: center; gap: 8px; padding: 4px 0; border-bottom: 1px dashed rgba(107,74,43,.25); }
  .cx-row:last-child { border-bottom: 0; }
  .cx-row .grow { flex: 1; min-width: 0; font-size: 13px; line-height: 1.5; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
  .cx-row .dn { min-width: 64px; }
  .cx-row .up { background: rgba(22,187,119,.2); color: var(--green2); border-radius: 6px; padding: 0 4px; white-space: nowrap; }
  .spc.gray { background: #5C666D; }
  .cx-sec { margin-top: 12px; }
  .cx-sec .rhead { color: #fff; border-bottom-color: rgba(255,255,255,.3); text-shadow: var(--stroke); }
  .cx-sec .rhead small { color: #C3CFDD; }
  .cx-sec .rhead .gtag { text-shadow: none; }
  .cx-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
  .cx-card { position: relative; background: var(--cream); border: 3px solid var(--gc, var(--brown)); border-radius: 14px; box-shadow: 0 4px 0 var(--brown2); padding: 8px 4px; display: flex; flex-direction: column; align-items: center; gap: 4px; font: inherit; color: var(--ink); cursor: pointer; text-align: center; min-width: 0; }
  .cx-card:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--brown2); }
  .cx-card .art { width: 72px; height: 72px; border-radius: 50%; background: radial-gradient(circle at 50% 45%, var(--el), rgba(0,0,0,.15) 75%); display: flex; align-items: center; justify-content: center; }
  .cx-card .art img { width: 78px; height: 78px; filter: drop-shadow(0 3px 2px rgba(0,0,0,.45)); }
  .cx-card .art .ro svg { width: 36px; height: 36px; }
  .cx-card .nm { font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .cx-card .tags { display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; }
  .cx-card .tags .spc { font-size: 13px; padding: 0 6px; }
  .cx-card .lv { font-size: 13px; background: var(--gold); color: #3a2a00; border-radius: 999px; padding: 0 8px; }
  .cx-card .how { font-size: 13px; color: var(--ink2); display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; max-width: 100%; overflow: hidden; }
  .cx-card.locked { filter: grayscale(.85) brightness(.85); }
  .cx-detail .cx-affline { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; font-size: 13px; }
  .cx-affline span { border-radius: 8px; padding: 4px 8px; background: rgba(0,0,0,.06); white-space: nowrap; }
  .cx-affline .up { background: rgba(22,187,119,.25); } .cx-affline .down { background: rgba(238,39,71,.22); }
  .cx-how { font-size: 15px; text-align: center; }
  .cx-enemy { display: flex; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px dashed rgba(107,74,43,.25); }
  .cx-enemy:last-child { border-bottom: 0; }
  .cx-enemy .ico svg { width: 40px; height: 40px; }
  .cx-enemy .grow { flex: 1; min-width: 0; line-height: 1.4; }
  .cx-enemy .sub, .cx-enemy .nums { font-size: 13px; color: var(--ink2); }
  /* 적 수치: 「체력 ×1 · 속도 ×1 · 보상 ×1 · 새면 생명 −1」 한 문장이던 것을 칩 넷으로 쪼갰다(K-2-15).
     같은 정보인데 읽을 덩어리가 작아지고, 설명 문장은 [?] 로 옮겨 화면에서 사라졌다 */
  .cx-enemy .echips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
  .cx-enemy .echips span { background: rgba(107,74,43,.12); border-radius: 999px; padding: 1px 8px; font-size: 13px; color: var(--ink2); white-space: nowrap; }
  /* 아이템 24종은 등급마다 접어 둔다(K-2-15) — 다 펼쳐 놓으면 설명이 여덟 줄이다. 궁금한 등급만 연다 */
  .cx-fold > summary { cursor: pointer; list-style: none; font-size: 15px; color: var(--ink); padding: 4px 0; display: flex; align-items: center; gap: 4px; }
  .cx-fold > summary::-webkit-details-marker { display: none; }
  .cx-fold > summary::after { content: " ▾"; margin-left: auto; color: var(--ink2); }
  .cx-fold[open] > summary::after { content: " ▴"; }
  .cx-fold[open] > summary { border-bottom: 2px solid rgba(107,74,43,.35); margin-bottom: 4px; }
  .rhead .hlp { margin-left: 6px; vertical-align: -4px; }
  .screen-head .hlp { margin-left: 4px; }
  .sec-head .hlp { margin-left: 4px; }
  /* ---------- 스위치와 [?] 도움말 (checklist K-2-15) ----------
     사장님: "텍스트 꾸역꾸역에 엉망진창 쓰레기 같은데 이걸 통과시켰다고?"
     ⑴ 켜짐/꺼짐을 글자 버튼 셋으로 세워 두던 것 → 한눈에 보이는 스위치.
        🛑 색만으로 알리지 않는다(WCAG 1.4.1) — 손잡이가 좌우로 옮겨 가는 것이 진짜 신호다.
     ⑵ 라벨 옆에서 세 줄로 흐르던 설명 → [?] 뒤로. 그래야 라벨이 한 줄로 고정되고 줄 높이가 고르다. */
  .sw { width: 56px; height: 32px; flex: 0 0 auto; border-radius: 999px; border: 3px solid #5C666D; background: #9AA3AA; position: relative; padding: 0; cursor: pointer; transition: background .15s, border-color .15s; }
  .sw .knob { position: absolute; top: 1px; left: 1px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 2px 0 rgba(0,0,0,.3); transition: transform .15s; }
  .sw.on { background: var(--green); border-color: var(--green2); }
  .sw.on .knob { transform: translateX(24px); }
  /* 3칸 선택 — 켜고 끄기(스위치)가 아니라 셋 중 하나를 고르는 자리(화면 흔들림 = 끄기/절반/기본).
     🛑 색만으로 알리지 않는다(WCAG 1.4.1): 고른 칸은 색이 바뀌는 동시에 안쪽에 흰 테두리가 생긴다 */
  .seg { display: inline-flex; flex: 0 0 auto; border: 3px solid var(--brown); border-radius: 12px; overflow: hidden; box-shadow: 0 3px 0 var(--brown2); }
  .seg button { font: inherit; font-family: var(--f-body); font-size: 13px; min-height: 38px; padding: 0 10px; border: 0; border-left: 2px solid var(--brown); background: var(--cream2); color: var(--ink2); cursor: pointer; }
  .seg button:first-child { border-left: 0; }
  .seg button.on { background: var(--green); color: #fff; text-shadow: var(--stroke); box-shadow: inset 0 0 0 2px rgba(255,255,255,.85); }
  .seg button:active { transform: translateY(1px); }
  .hlp { width: 26px; height: 26px; flex: 0 0 auto; border-radius: 50%; border: 2px solid var(--brown); background: var(--cream2); color: var(--brown2); font: inherit; font-size: 15px; line-height: 1; padding: 0; cursor: pointer; }
  .hlp:active { transform: translateY(2px); }
  .hlp.light { border-color: rgba(255,255,255,.5); background: rgba(255,255,255,.14); color: #fff; }
  /* 도움말 창: 궁금해서 연 사람만 보는 곳이라 여기서는 길게 써도 된다 */
  #helpModal .modal p { margin: 0; font-size: 15px; line-height: 1.5; color: var(--ink); }
  #helpModal .modal .credit { font-size: 13px; color: var(--ink2); line-height: 1.45; border-top: 2px dashed rgba(107,74,43,.3); padding-top: 8px; }
  /* ---------- 상성을 그림으로 (checklist K-2-7) — 6×6 숫자 표 앞에 「약점 바퀴」를 둔다. 표는 그대로 뒤에 남는다.
     방패 넷을 3×3 칸의 十자 자리에 놓고(가운데는 도는 화살표), 방패마다 「잘 드는 공격 ▲」과 「안 먹히는 공격 ▼」을 붙인다.
     🛑 값·관계는 codex.js 가 data/affinity.json 을 읽어 만든다 — 여기(그림)에도, 거기(코드)에도 숫자를 적지 않는다 ---------- */
  .cx-wheel { padding: 10px 10px 12px; margin-top: 10px; }
  /* 가운데 칸(도는 화살표)은 좁아도 되고, 좌우 방패 칸은 「에너지 ×0.6」 칩이 들어갈 만큼 넓어야 한다.
     1fr 셋으로 나누면 360px 폭에서 칩이 칸 밖으로 삐져나갔다(2026-09-07 실측) */
  .wheel { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; margin-top: 8px; }
  .wheel .wmid { min-width: 40px; }
  .wnode { border-radius: 12px; border: 3px solid var(--brown); background: var(--cream2); padding: 4px 2px 8px; display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; box-shadow: 0 3px 0 var(--brown2); }
  .wnode .sh { width: 42px; height: 42px; display: block; filter: drop-shadow(0 2px 0 rgba(0,0,0,.25)); }
  .wnode .dn { font-size: 18px; line-height: 1.1; white-space: nowrap; }
  /* 🛑 max-width 로 박스만 줄이면 글자가 박스 밖으로 흘러 카드를 넘는다 — 눈에는 삐져나온 것으로 보이는데
     자동 검사는 「박스는 카드 안」이라 통과시킨다(2026-09-07 실기기 확인). 좁은 좌우 카드(약 128px)에
     「에너지 ×0.6」이 들어가도록 여백과 사이를 줄인다. 여백 통일(K-2-10)로 8px 이 되면서 다시 넘쳤던 자리다. */
  .wnode .wa { display: inline-flex; align-items: center; justify-content: center; gap: 2px; font-size: 13px; line-height: 1.5; border-radius: 999px; padding: 0 5px; color: #fff; text-shadow: var(--stroke); white-space: nowrap; max-width: 100%; min-width: 0; }
  .wnode .wa.hi { background: var(--green2); }
  .wnode .wa.lo { background: var(--red2); }
  .wnode .wa svg { width: 10px; height: 10px; flex: 0 0 auto; }
  .wmid { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-align: center; color: var(--ink2); font-size: 13px; line-height: 1.25; padding: 4px; }
  .wmid svg.turn { width: 46px; height: 46px; }
  .wexc { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
  .wcard { border-radius: 12px; border: 3px dashed var(--brown); background: rgba(107,74,43,.08); padding: 8px 8px; display: flex; align-items: center; gap: 8px; font-size: 13px; line-height: 1.3; }
  .wcard .sh { width: 30px; height: 30px; flex: 0 0 auto; }
  .wcard b { display: block; font-size: 15px; }
  .watk { margin-top: 12px; display: flex; flex-direction: column; gap: 4px; }
  .watk .wrow { display: flex; align-items: center; gap: 8px; font-size: 13px; line-height: 1.35; }
  .watk .wrow .ak { flex: 0 0 auto; }
  /* ---------- 강화 탭: 강화 나무 위에 뽑기 카드 ---------- */
  .grow-gacha { display: flex; align-items: center; gap: 10px; padding: 10px 12px; margin-bottom: 12px; }
  .grow-gacha .grow { flex: 1; min-width: 0; font-size: 15px; line-height: 1.4; }
  .grow-gacha .grow small { color: var(--ink2); font-size: 13px; display: block; }
  .grow-gacha .btn { min-height: 50px; font-size: 15px; flex: 0 0 auto; }
  /* ---------- 순위 탭: 월별 시즌 패널(J-11 ⑤) ---------- */
  .season { padding: 10px 12px; margin-bottom: 10px; }
  .season .shead { display: flex; align-items: center; gap: 8px; font-size: 20px; }
  .season .shead small { font-size: 13px; color: var(--ink2); margin-left: auto; font-weight: 400; }
  .season .score { font-size: 28px; color: var(--gold2); line-height: 1.1; }
  .season .bd { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 13px; color: var(--ink2); margin: 4px 0; }
  .season .bd b { color: var(--ink); }
  .season .prize { font-size: 13px; line-height: 1.5; background: rgba(255,201,60,.18); border-radius: 8px; padding: 8px 8px; margin-top: 8px; }
  .season .last { font-size: 13px; color: var(--ink2); margin-top: 8px; line-height: 1.4; }
  .season .last b { color: var(--ink); }
  /* 결과 화면 버튼은 최대 3개(사장님: 7개는 많다) */
  #endBtns { width: 100%; max-width: 360px; }
  #endBtns .btn { min-width: 0; flex: 1 1 100px; white-space: nowrap; }
  #endBtns #endNext, #endBtns #endCode { flex-basis: 100%; } /* 주 버튼은 한 줄 전체 — 폰 폭에서 "다음 스테이지"가 세 줄로 깨졌다 */
  @media (min-width: 700px) { #towerBar, #bottom { left: 50%; right: auto; transform: translateX(-50%); width: min(640px, 100vw - 16px); } .tree, .panel.list, .mapGrid, #recordBody, .tabs { max-width: 700px; width: 100%; margin-left: auto; margin-right: auto; } }
</style>
</head>
<body>
<!-- 로딩 화면: 스크립트를 받기 전에 먼저 뜬다. 진행은 아래 boot 스크립트(NGN_LOADING)가 채운다 -->
<div id="loading">
  <h1 class="title">P의 디펜스</h1>
  <div class="bar"><div class="fill" id="loadFill"></div><span class="pct" id="loadPct">0%</span></div>
  <div class="what" id="loadWhat">준비하는 중…</div>
  <div class="tip" id="loadTip"></div>
</div>
<div id="stage"></div>
<div id="vignette"></div>

<!-- 로비(checklist J-11 ②) = 옛 메인 메뉴를 승격. 배경은 3D 지도(다음 스테이지)가 천천히 돈다. 하단 탭 넷(#lobbyTabs)이 화면을 모은다:
     [전투] 이 화면 — [▶ 스테이지 N](월드맵) · [무한] · [오늘의 판] · 출석 도장 · 오늘의 미션 / [타워] 도감 / [강화] 강화 나무 + 뽑기 / [순위] 시즌 + 순위표. 설정은 상단 오른쪽 톱니 -->
<section id="menu" class="overlay" hidden>
  <div class="menu-top"><span class="pill" id="menuTickets"></span><span class="pill" id="menuStars"></span><span class="spacer"></span><button class="rbtn small" id="menuSettings" title="설정"><span class="circ"><svg class="i" viewBox="0 0 24 24"><path fill="currentColor" d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.7 7.7 0 0 0-1.7-1L15 3H9l-.3 2.9a7.7 7.7 0 0 0-1.7 1l-2.5-1-2 3.5L4.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.7 7.7 0 0 0 1.7 1L9 21h6l.3-2.9a7.7 7.7 0 0 0 1.7-1l2.5 1 2-3.5L19.4 13zM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7z"/></svg></span></button></div>
  <h1 class="title">P의 디펜스</h1>
  <!-- ▼ 로비 = 「입구」 (checklist K-2-9, 2026-09-07 사장님: "왜 로비페이지에 다 때려넣냐는거야.
       메뉴버튼 만들어서 내부로 각각 페이지 만들라고.")
       전에는 스테이지·무한·오늘의 판·출석 7칸·미션 3줄을 한 화면에 세로로 다 쌓아 무엇도 크게 못 보여줬다.
       이제 곁다리는 좌우 아이콘 열로 빼고(누르면 전용 페이지), 가운데는 「다음에 갈 스테이지」가 주인공, 아래는 큰 [전투] 하나. -->
  <!-- 저장 지킴이(I-12): 아이폰 사파리는 7일 안 들어오면 저장을 지운다. 홈 화면 앱은 면제.
       🔴 2026-09-07: 이 배너가 절대배치로 화면 150~192px 에 떠서 스테이지 번호(160~186px)를 통째로 덮고 있었다.
       조카가 게임을 처음 켰을 때 자기가 몇 번째 판에 있는지 안 보였다 — 첫 인상에서 가장 중요한 정보다.
       → 흐름 안(제목 아래·본문 위)으로 내려서 배너가 떠도 아래가 밀릴 뿐 가려지지 않게 했다. -->
  <div class="panel a2hs" id="a2hs" hidden><span class="grow"><b>홈 화면에 추가</b>하면 기록이 안 지워져요</span><button class="btn blue tiny" id="a2hsMore">방법</button><button class="btn gray tiny" id="a2hsClose">닫기</button></div>
  <div class="lobby-body">
    <div class="gate">
      <button class="gbtn" id="gateMission"></button>
      <button class="gbtn" id="gateDaily"></button>
    </div>
    <div class="stage-main">
      <div class="sno" id="lobbyStageNo"></div>
      <div class="snm" id="lobbyStageName"></div>
      <div class="sst" id="lobbyStageStars"></div>
      <!-- 🛑 다음 스테이지의 작은 3D 모형 자리 — checklist K-2-8 은 3D 담당 몫이다. 화면 담당은 크기·자리만 잡아 두고 비워 둔다 -->
      <div id="lobbyStage3D"></div>
    </div>
    <div class="gate">
      <button class="gbtn" id="gateInfinite"></button>
      <button class="gbtn" id="gateGacha"></button>
      <button class="gbtn" id="gateSeason"></button>
    </div>
  </div>
  <div class="menu-bottom">
    <button class="btn green big" id="menuPlay"></button>
  </div>
</section>

<!-- ▼ 로비 아이콘에서 열리는 전용 페이지 「일일」 (checklist K-2-9·11). 오른쪽 위 [X]로 닫는다.
     🔵 2026-09-07: 처음엔 출석과 미션을 페이지 둘로 나눴는데, 미션이 하루 3개뿐이라 화면 아래 60%가 비었다.
        둘 다 「매일 받는 것」이라 한 페이지에 두는 게 이치에도 맞고 빈 곳도 사라진다 — 로비 아이콘도 하나로 줄었다.
     오늘의 판·무한 모드·뽑기·시즌은 이미 자기 흐름(바로 시작 / 지도 고르기 / 강화 탭 / 순위 탭)이 있어 새로 만들지 않고 그리로 보낸다 — 중복 구현 금지 -->
<section id="missionScreen" class="overlay scroll" hidden>
  <div class="sheet-head"><h2>일일 <span class="sub" id="missionSub"></span></h2><button class="xbtn" id="missionClose" title="닫기"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M18.3 5.7 12 12l6.3 6.3-1.4 1.4L10.6 13.4 4.3 19.7 2.9 18.3 9.2 12 2.9 5.7l1.4-1.4 6.3 6.3 6.3-6.3z"/></svg></button></div>
  <div id="missionBody"></div>
</section>

<!-- 난이도 고르기(I-3): 월드맵 점을 누르면. 어려움은 보통으로 깨야 열린다 -->
<div class="modalWrap" id="diffModal" hidden><div class="panel modal"><h3 id="diffTitle"></h3><div class="difflist" id="diffList"></div><div class="row"><button class="btn gray" id="diffClose">닫기</button></div></div></div>
<!-- 코드 보기/넣기·이름 묻기(records.js 가 채운다) -->
<div class="modalWrap" id="codeModal" hidden></div>
<!-- 도움말 (checklist K-2-15, 2026-09-07 사장님 "텍스트 꾸역꾸역에 엉망진창"):
     화면에 늘 떠 있던 긴 설명을 전부 여기로 옮겼다. 게임 화면은 설명서가 아니다 — 궁금할 때만 [?] 를 누른다. -->
<div class="modalWrap" id="helpModal" hidden></div>

<!-- 로비 탭 바(J-11 ②): 로비류 화면(로비·월드맵·도감·강화·순위·설정·지도 고르기)에서만 보인다. 빨간 점 = 새 알림(받을 미션 보상·새 계열·티켓·시즌 결과) -->
<nav id="lobbyTabs" hidden>
  <button data-tab="battle"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M6.9 3 3 6.9l7.1 7.1-2.3 2.3-1.4-1.4-1.4 1.4 1.8 1.8L4.4 20.5 5.8 22l2.4-2.4 1.8 1.8 1.4-1.4-1.4-1.4 2.3-2.3 7.1 7.1 0-0L21 17.1 13.9 10l1.6-1.6 2.4 0 3.1-3.1V3h-2.3l-3.1 3.1v2.4L14 10.1z"/></svg><span>전투</span><span class="dot" hidden></span></button>
  <button data-tab="tower"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M4 21V9h2.5V5H9v2h2V5h2v2h2V5h2.5v4H20v12h-6v-5h-4v5H4z"/></svg><span>타워</span><span class="dot" hidden></span></button>
  <button data-tab="grow"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 2l3 6.6 7 .8-5.2 4.8 1.5 7L12 17.7 5.7 21.2l1.5-7L2 9.4l7-.8z"/></svg><span>강화</span><span class="dot" hidden></span></button>
  <button data-tab="rank"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M6 3h12v3h3v3a5 5 0 0 1-4.2 4.9A6 6 0 0 1 13 17.9V20h4v2H7v-2h4v-2.1A6 6 0 0 1 7.2 13.9 5 5 0 0 1 3 9V6h3V3zm-1 5v1a3 3 0 0 0 2 2.8V8H5zm14 0h-2v3.8A3 3 0 0 0 19 9V8z"/></svg><span>순위</span><span class="dot" hidden></span></button>
</nav>

<!-- 도감(J-11 ③): 상성표 6×6 · 타워 30계열 · 적 6종+성질 9종+방어 6 · 아이템 24종. 전투 화면의 학습 요소를 여기로 옮겼다 -->
<section id="codexScreen" class="overlay scroll" hidden>
  <div class="screen-head"><h2>도감</h2></div>
  <div class="tabs" id="codexTabs"><button data-sub="affinity" class="on">상성표</button><button data-sub="towers">타워</button><button data-sub="enemies">적</button><button data-sub="items">아이템</button></div>
  <div id="codexBody"></div>
</section>

<!-- 월드맵: 길 위의 점 20개. 점을 누르면 덱 편성 없이 바로 전투 -->
<section id="worldScreen" class="overlay scroll" hidden>
  <div class="world-head"><button class="btn blue back" id="worldBack">◀</button><span class="pill" id="worldStars"></span><span class="spacer"></span><button class="btn gold" id="worldUpgrade"></button></div>
  <div class="world" id="world"></div>
</section>

<!-- 강화 나무: 별을 쓰는 곳. 되돌리기 무료 -->
<section id="upgradeScreen" class="overlay scroll" hidden>
  <!-- 안내 세 줄은 [?] 뒤로 옮겼다(checklist K-2-15) — 게임 화면은 설명서가 아니다 -->
  <div class="screen-head"><h2>강화</h2><button class="hlp light" data-help="tree">?</button><span class="spacer" style="flex:1"></span><span class="pill" id="upgradeStars"></span></div>
  <!-- 뽑기(J-11 ②): 강화 탭 안에. 티켓이 있으면 탭에 빨간 점 -->
  <div class="panel grow-gacha" id="growGacha"></div>
  <div class="tree" id="tree"></div>
  <button class="btn red" id="treeReset">전부 되돌리기</button>
</section>

<!-- 무한 모드 지도 선택(스테이지 10 을 깨야 열린다). 기록 겨루기는 여기서만 -->
<section id="mapScreen" class="overlay scroll" hidden>
  <div class="screen-head"><button class="btn blue back" id="mapBack">◀</button><h2>무한 모드 <span class="sub">지도를 고르면 끝없이 이어진다 · 지도마다 기록</span></h2></div>
  <div class="mapGrid" id="mapGrid"></div>
  <div class="screen-foot two"><button class="btn gray" id="mapMore">지도 더 보기 +12</button><button class="btn green big" id="mapStart" disabled>▶ 출전</button></div>
</section>

<!-- 순위표(I-10): 캠페인·무한·도전 세 탭. 친구 기록은 코드로 — 바깥 서비스 없음 -->
<section id="recordScreen" class="overlay scroll" hidden>
  <div class="screen-head"><h2>순위</h2><span class="spacer" style="flex:1"></span><button class="btn gold tiny" id="recordName"></button></div>
  <!-- 월별 시즌(J-11 ⑤): 이번 달 점수·내역·친구 순위·상품. records.js 가 채운다 -->
  <div id="seasonBox"></div>
  <div class="tabs" id="recordTabs"><button data-tab="campaign" class="on">캠페인</button><button data-tab="infinite">무한</button><button data-tab="daily">도전</button></div>
  <div id="recordBody"></div>
  <div class="screen-foot two"><button class="btn gray" id="recordFriends">친구 관리</button><button class="btn blue" id="recordPaste">친구 코드 넣기</button></div>
</section>

<!-- 설정 -->
<section id="settingScreen" class="overlay scroll" hidden>
  <div class="screen-head"><button class="btn blue back" id="settingBack">◀</button><h2>설정</h2></div>
  <div class="panel list" id="settingList"></div>
</section>

<div id="game" hidden>
  <div id="hud">
    <button class="ibtn" id="btnMenu" title="나가기"><svg viewBox="0 0 24 24"><path fill="#fff" d="M15 4 7 12l8 8 2-2-6-6 6-6z"/></svg></button>
    <div id="waveBar"><div class="track"><div class="fill"></div><div class="ticks"></div><span class="num" id="waveNo">1/8</span></div>
      <!-- 카운트다운 줄(웨이브 사이에만): "다음 8초" + 다음 웨이브 적 아이콘 + 보스/성질 칩. 웨이브 중엔 사라진다 -->
      <div class="cd" id="countdown" hidden><span class="sec dk" id="cdSec"></span><span class="cdfoes dk" id="cdFoes"></span></div>
    </div>
    <!-- 배속: 전에는 화면 오른쪽 아래 큰 버튼이 웨이브 중에 배속으로 바뀌었는데, 그게 세 번째 타워 카드 바로 옆이라
         카드를 고르려다 배속을 누르게 됐다(사장님 지적 2026-09-07). 손가락이 안 닿는 위쪽으로 옮긴다 -->
    <button class="ibtn" id="speedBtn" title="배속" hidden>1×</button>
    <button class="ibtn" id="pauseBtn" title="일시정지"><svg viewBox="0 0 24 24"><path fill="#fff" d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg></button>
    <div id="hudRight">
      <span class="mpill" id="lifePill"><svg class="i" viewBox="0 0 24 24"><path fill="#E8443A" d="M12 21s-7.5-4.6-9.5-9.3C1 8 3.4 4.5 7 4.5c2 0 3.6 1.1 5 2.8 1.4-1.7 3-2.8 5-2.8 3.6 0 6 3.5 4.5 7.2C19.5 16.4 12 21 12 21z"/></svg><span class="num" id="lives">20</span></span>
      <span class="mpill" id="goldPill"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#F5B301"/><circle cx="12" cy="12" r="7" fill="#FFD84D"/><path d="M12 7v10M9.5 9.5h4a1.75 1.75 0 0 1 0 3.5h-3a1.75 1.75 0 0 0 0 3.5h4" stroke="#B8860B" stroke-width="1.8" fill="none"/></svg><span class="num gold" id="gold">60</span></span>
      <span class="mpill" id="bagPill" hidden title="가방 — 떨어진 아이템. 타워를 눌러 끼운다"></span>
    </div>
  </div>
  <!-- 보스 체력 막대: 보스가 살아 있는 동안만 HUD 바로 아래 한 줄. 깎일 때 흰 번쩍(.flash) -->
  <div id="bossBar" hidden><span class="nm">보스</span><div class="track"><div class="fill"></div><div class="glint"></div></div><span class="pct" id="bossPct">100%</span></div>
  <div id="nextDetail" class="panel" hidden></div>
  <!-- 성이 맞았을 때 가장자리 붉은 번쩍(0.35초) · 적이 출구 가까이 오면 천천히 깜빡이는 붉은 비네트 -->
  <div id="dmgFlash"></div>
  <div id="danger" hidden></div>
  <!-- 일시정지: 엔진·카운트다운·연출 전부 멈춤. [계속] [나가기] -->
  <div id="pauseOverlay" hidden><div class="ptitle">일시정지</div><div class="prow"><button class="btn green big" id="pauseResume">계속</button><button class="btn gray mid" id="pauseQuit">나가기</button></div></div>
  <div id="bottom">
    <button class="ibtn" id="rotateBtn" title="돌리기"><svg viewBox="0 0 24 24"><path fill="#fff" d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg></button>
    <div id="towerBar"></div>
    <button class="btn green" id="waveBtn" title="웨이브 시작"><svg viewBox="0 0 24 24"><path fill="#fff" d="M8 5v14l11-7z"/></svg></button>
  </div>
  <div id="pop" hidden></div>
  <div id="hint" hidden><div class="arrow"></div><div class="txt panel"></div></div>
  <div id="floaters"></div>
  <div id="toast" class="panel" hidden></div>
</div>

<section id="endScreen" hidden>
  <h1 id="endTitle"></h1>
  <div class="endStars" id="endStars" hidden></div>
  <div class="panel"><div id="endBody"></div><div id="ticketLines"></div></div>
  <!-- 버튼은 세 개까지(J-11 ③, 사장님: 7개 → 3개). 뽑기·순위·월드맵은 [로비]의 탭 빨간 점이 안내한다 -->
  <div id="endBtns">
    <button id="endNext" class="btn green">다음 스테이지 ▶</button>
    <button id="endRetry" class="btn blue">다시</button>
    <button id="endRecords" class="btn blue">순위</button>
    <button id="endMenu" class="btn gray">로비</button>
    <button id="endCode" class="btn gold" hidden>기록 코드</button>
  </div>
</section>

<section id="gachaScreen" hidden>

<!-- 부팅: 스크립트를 하나씩 받으며 로딩 막대를 채운다(0~30%). 그 뒤 데이터·모델은 main.js 가 NGN_LOADING 으로 이어 채운다.
     파일 위치는 window.__NGN_PATHS__(나눔 빌드가 넣는다)로 바꾼다. 번들(단일 HTML)은 __NGN_INLINE__ 을 세워 이 목록을 안 받고 뒤에 인라인된 것을 쓴다.
     SCRIPTS 는 유효한 JSON 배열이어야 한다 — game/build.js·bundle.js 가 이 줄을 읽는다 -->
<script>window.__NGN_VERSION__ = "bf2e344d15"; window.__NGN_PATHS__ = { data: "data/", assets: "assets/", sim: "js/sim/", vendor: "js/vendor/" };</script>
<script>
(function () {
  const P = Object.assign({ sim: '../sim/', vendor: 'vendor/', data: '../data/', assets: 'assets/' }, window.__NGN_PATHS__ || {});
  const SCRIPTS = ["vendor/three.r128.min.js", "vendor/GLTFLoader.r128.js", "vendor/SimplexNoise.js", "vendor/LightningStrike.js", "vendor/postprocessing.r128.js", "vendor/lz-string.1.5.0.min.js", "sim/map.js", "sim/mapgen.js", "sim/engine.js", "sim/ai.js", "sim/build-waves.js", "js/data.js", "js/world.js", "js/fx.js", "js/models.js", "js/render.js", "js/ui.js", "js/meta.js", "js/records.js", "js/codex.js", "js/gacha.js", "js/main.js"];
  const TIPS = ["공중 적에겐 <b>대공</b>이 되는 타워를 — 카드의 화살표를 보세요", "타워를 <b>길게 누르면</b> 설명과 3단 모습이 나와요", "3단 승급은 <b>화력</b>과 <b>광역</b> 중 하나 — 정답은 없어요", "별은 <b>강화</b>에 쓰고, 잘못 찍었으면 전부 되돌리기(무료)", "어려움은 적 체력이 <b>2배</b> — 붉은 별은 따로 셉니다", "<b>홈 화면에 추가</b>하면 인터넷 없이도 열려요", "떨어진 <b>아이템</b>은 타워를 눌러 끼우세요 — 판이 끝나면 사라져요", "<b>기록 코드</b>를 단톡방에 올리면 친구 순위표에 나란히 떠요", "적 발밑 <b>색 고리</b>가 성질 — 갑옷·질주·재생·분열…", "<b>오늘의 판</b>은 하루 한 번, 모두 같은 지도·같은 조건", "로비 [타워] 탭의 <b>상성표</b> — 어느 공격이 어느 방어에 센지 한눈에", "<b>일일 미션</b> 셋을 다 하면 티켓 보너스 — 못 한 날 벌칙은 없어요", "매달 1일 <b>시즌 점수</b>만 0 — 별·타워·강화는 그대로"];
  const fill = document.getElementById('loadFill'), pct = document.getElementById('loadPct'), what = document.getElementById('loadWhat'), tip = document.getElementById('loadTip'), box = document.getElementById('loading');
  box.style.backgroundImage = `url(${P.assets}loading.jpg)`;
  let tipNo = Math.floor(Math.random() * TIPS.length);
  const showTip = () => { tip.innerHTML = TIPS[tipNo % TIPS.length]; tipNo++; tip.style.animation = 'none'; void tip.offsetWidth; tip.style.animation = ''; };
  showTip(); const tipTimer = setInterval(showTip, 2600);
  let cur = 0;
  window.NGN_LOADING = {
    set(p, label) { cur = Math.max(cur, Math.min(100, p)); fill.style.width = cur + '%'; pct.textContent = Math.round(cur) + '%'; if (label) what.textContent = label; },
    fail(msg) { what.textContent = '문제가 생겼어요: ' + msg; box.classList.add('fail'); },
    done() { this.set(100, '준비 완료!'); clearInterval(tipTimer); setTimeout(() => { box.classList.add('out'); setTimeout(() => box.remove(), 500); }, 250); },
  };
  if (window.__NGN_INLINE__) return; // 번들: 스크립트가 이미 아래에 심겨 있다
  // 🔴 파일 이름에 버전을 붙인다(2026-09-07). 안 붙이면 GitHub Pages 가 주는 브라우저 캐시(max-age) 때문에
  //    새 index.html + 옛 js 가 섞여 게임이 통째로 안 뜬다(실측: 배포 직후 ui.js 68,998 옛것 / 새것 77,061 → "문제가 생겼어요").
  //    개발 서버에는 __NGN_VERSION__ 이 없어 쿼리가 안 붙는다(늘 새 파일).
  const V = window.__NGN_VERSION__ ? '?v=' + window.__NGN_VERSION__ : '';
  const url = (s) => (s.startsWith('vendor/') ? P.vendor + s.slice(7) : s.startsWith('sim/') ? P.sim + s.slice(4) : s) + V;
  const names = { three: '3D 엔진', GLTFLoader: '모델 읽기', Lightning: '번개', Simplex: '번개', lz: '기록 코드', map: '지도', mapgen: '지도 생성기', engine: '게임 규칙', ai: '자동 플레이', 'build-waves': '웨이브', data: '데이터', world: '세계', fx: '효과', models: '부품', render: '연출', ui: '화면', meta: '진행 저장', records: '순위표', gacha: '뽑기', main: '시작' };
  (async () => {
    for (let i = 0; i < SCRIPTS.length; i++) {
      const s = SCRIPTS[i];
      const key = Object.keys(names).find((k) => s.includes(k));
      window.NGN_LOADING.set(i / SCRIPTS.length * 30, `${names[key] || s} 받는 중…`);
      await new Promise((ok, bad) => { const el = document.createElement('script'); el.src = url(s); el.onload = ok; el.onerror = () => bad(new Error(s)); document.body.appendChild(el); });
    }
    window.NGN_LOADING.set(30, '데이터 받는 중…');
  })().catch((e) => window.NGN_LOADING.fail('파일을 못 받았어요 (' + e.message + ') — 인터넷을 확인하고 다시 열어 주세요'));
})();
</script>
