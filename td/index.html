<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>P의 디펜스</title>
<!-- PWA(checklist J-0, 2026-09-06): 홈 화면 앱 + 오프라인. 글꼴은 로컬(vendor/fonts — 나눔 빌드는 assets/fonts). 밖에서 가져오는 것 0개 -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0E1410">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="P의 디펜스">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="assets/fonts/jua.local.css" id="fontCss">
<style>
  /* ---------- 로딩 화면(화면 설계안 5번): 진행 막대 · 게임 그림 · 짧은 팁. 로딩을 숨기지 않고 게임답게 보여준다(사장님: "로딩시간은 당연한 거야") ---------- */
  #loading { position: fixed; inset: 0; z-index: 100; background: #0E1410 center / cover no-repeat; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding: 0 22px calc(46px + env(safe-area-inset-bottom)); color: #fff; font-family: "Jua", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif; transition: opacity .45s; }
  #loading::before { content: ""; position: absolute; inset: 0; background: linear-gradient(rgba(10,16,24,.15), rgba(10,16,24,.2) 45%, rgba(10,16,24,.92) 78%); pointer-events: none; }
  #loading > * { position: relative; }
  #loading.out { opacity: 0; pointer-events: none; }
  #loading .title { margin: 0 0 18px; font-size: 44px; color: #FFC93C; text-shadow: 1px 1px 0 #000, -1px 1px 0 #000, 1px -1px 0 #000, -1px -1px 0 #000, 0 2px 0 #000, 0 -2px 0 #000, 2px 0 0 #000, -2px 0 0 #000, 0 6px 0 rgba(0,0,0,.35); }
  #loading .bar { width: min(360px, 100%); height: 26px; border-radius: 999px; background: #FFF7E6; border: 3px solid #6B4A2B; box-shadow: 0 4px 0 #4A3320, 0 6px 12px rgba(0,0,0,.35); position: relative; overflow: hidden; }
  #loading .bar .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: linear-gradient(#8CE86A, #46B83A); transition: width .25s; }
  #loading .bar .fill::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(-45deg, rgba(255,255,255,.22) 0 10px, transparent 10px 20px); animation: stripes 1s linear infinite; }
  @keyframes stripes { to { transform: translateX(28px); } }
  #loading .bar .pct { position: absolute; left: 0; right: 0; top: 0; line-height: 20px; text-align: center; font-size: 15px; color: #fff; text-shadow: 1px 1px 0 #000, -1px 1px 0 #000, 1px -1px 0 #000, -1px -1px 0 #000; font-variant-numeric: tabular-nums; }
  #loading .what { margin-top: 8px; font-size: 13px; color: #D7DEE8; min-height: 1.3em; }
  #loading .tip { margin-top: 18px; padding: 8px 16px; border-radius: 14px; background: rgba(255,247,230,.92); color: #2B1D12; border: 3px solid #6B4A2B; box-shadow: 0 4px 0 #4A3320; font-size: 15px; text-align: center; max-width: 360px; line-height: 1.4; animation: tipIn .35s; }
  @keyframes tipIn { from { opacity: 0; transform: translateY(8px); } }
  #loading .tip b { color: #B8860B; }
  /* 게임 UI 원칙(참고: 인기 모바일 디펜스 화면): 가장자리에 UI, 중앙은 3D. 불투명 크림 패널 + 두꺼운 갈색 테두리 + 입체 그림자.
     아이콘+숫자만(라벨 없음). 숫자는 굵은 라운드체 + 검은 외곽선. 버튼은 원색·눌리면 내려간다. 이모지 없음 — 전부 SVG.
     흐름(design.md 12장): 메뉴 → 월드맵(점 20개) → 전투 → 결과(별) → 월드맵. 무한 모드는 따로(스테이지 10 뒤). 덱 편성 없음. */
  :root {
    --cream: #FFF7E6; --cream2: #F3E7CC; --brown: #6B4A2B; --brown2: #4A3320; --ink: #2B1D12; --ink2: #6B5A48;
    --gold: #FFC93C; --gold2: #B8860B; --blue: #3AA0F0; --blue2: #1D5FA0; --green: #58C24A; --green2: #2E7D32; --red: #E85A4F; --red2: #9E2B22;
    --stroke: 1px 1px 0 #000, -1px 1px 0 #000, 1px -1px 0 #000, -1px -1px 0 #000, 0 2px 0 #000, 0 -2px 0 #000, 2px 0 0 #000, -2px 0 0 #000;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin: 0; background: #0E1410; color: var(--ink); font-family: "Jua", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif; overflow: hidden; font-size: 16px; }
  #stage { position: fixed; inset: 0; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  svg.i { width: 1em; height: 1em; vertical-align: -0.15em; fill: currentColor; }
  .num { font-weight: 400; color: #fff; text-shadow: var(--stroke); letter-spacing: .02em; font-variant-numeric: tabular-nums; }
  .num.gold { color: var(--gold); }
  .num.red { color: #FF6B5E; }
  .num.green { color: #7CE76A; }

  /* 패널·버튼 재질 */
  .panel { background: var(--cream); border: 3px solid var(--brown); border-radius: 14px; box-shadow: 0 4px 0 var(--brown2), 0 6px 12px rgba(0,0,0,.35); color: var(--ink); }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px 4px 8px; border-radius: 999px; background: var(--cream); border: 3px solid var(--brown); box-shadow: 0 3px 0 var(--brown2), 0 5px 10px rgba(0,0,0,.3); font-size: 19px; white-space: nowrap; }
  .pill svg.i { font-size: 22px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; font: inherit; color: #fff; text-shadow: var(--stroke); cursor: pointer; border: 3px solid; border-radius: 14px; min-height: 54px; padding: 6px 16px; font-size: 20px; transition: transform .05s, box-shadow .05s; }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--sh) !important; }
  .btn.blue { background: var(--blue); border-color: var(--blue2); --sh: var(--blue2); box-shadow: 0 5px 0 var(--blue2), 0 7px 12px rgba(0,0,0,.3); }
  .btn.green { background: var(--green); border-color: var(--green2); --sh: var(--green2); box-shadow: 0 5px 0 var(--green2), 0 7px 12px rgba(0,0,0,.3); }
  .btn.red { background: var(--red); border-color: var(--red2); --sh: var(--red2); box-shadow: 0 5px 0 var(--red2), 0 7px 12px rgba(0,0,0,.3); }
  .btn.gold { background: var(--gold); border-color: var(--gold2); --sh: var(--gold2); color: #3a2a00; text-shadow: none; box-shadow: 0 5px 0 var(--gold2), 0 7px 12px rgba(0,0,0,.3); }
  .btn.gray { background: #9AA3AA; border-color: #5C666D; --sh: #5C666D; box-shadow: 0 5px 0 #5C666D; }
  .btn:disabled { filter: grayscale(1) brightness(.75); cursor: default; }
  .rbtn { display: flex; flex-direction: column; align-items: center; gap: 2px; width: 60px; background: none; border: 0; padding: 0; cursor: pointer; color: #fff; font: inherit; font-size: 12px; text-shadow: var(--stroke); position: relative; }
  .rbtn .circ { width: 52px; height: 52px; border-radius: 50%; background: var(--cream); border: 3px solid var(--brown); box-shadow: 0 3px 0 var(--brown2), 0 5px 10px rgba(0,0,0,.3); display: flex; align-items: center; justify-content: center; color: var(--brown); font-size: 26px; transition: transform .05s; }
  .rbtn:active .circ { transform: translateY(3px); box-shadow: 0 0 0 var(--brown2); }
  .rbtn .dot { position: absolute; top: -2px; right: 4px; width: 14px; height: 14px; border-radius: 50%; background: #FF3B30; border: 2px solid #fff; }

  /* ---------- 메뉴·지도·덱·기록·설정 화면 (3D 위에 얹히는 오버레이) ---------- */
  .overlay { position: fixed; inset: 0; z-index: 20; color: #fff; padding: calc(12px + env(safe-area-inset-top)) 14px calc(14px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; animation: screenIn .28s cubic-bezier(.2,.8,.2,1); }
  @keyframes screenIn { from { opacity: 0; transform: translateY(14px) scale(.985); } to { opacity: 1; transform: none; } }
  #pop, #toast, #nextDetail { animation: popIn .18s cubic-bezier(.2,.9,.3,1.2); }
  @keyframes popIn { from { opacity: 0; transform: translate(-50%, -100%) scale(.85); } }
  #toast { animation-name: toastIn; } @keyframes toastIn { from { opacity: 0; transform: translateX(-50%) scale(.85); } }
  #nextDetail { animation-name: fadeIn; } @keyframes fadeIn { from { opacity: 0; } }
  .overlay.scroll { background: radial-gradient(ellipse at 50% 0%, rgba(61,107,142,.96), rgba(26,42,58,.98) 70%); overflow-y: auto; }
  .overlay h2 { margin: 0; font-size: 22px; text-shadow: var(--stroke); }
  .overlay h3 { margin: 14px 0 8px; font-size: 17px; text-shadow: var(--stroke); }
  .overlay .sub { font-size: 13px; opacity: .9; font-weight: 400; text-shadow: none; }
  .screen-head { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .screen-head .back { min-height: 46px; min-width: 52px; padding: 4px 10px; font-size: 18px; }
  .screen-foot { margin-top: auto; padding-top: 12px; display: flex; gap: 10px; }
  .screen-foot .btn { flex: 1; min-height: 60px; font-size: 22px; }
  .screen-foot.two .gray { flex: 0 0 auto; font-size: 17px; }
  #menu { background: linear-gradient(rgba(10,20,30,.35), rgba(10,20,30,0) 30%, rgba(10,20,30,0) 60%, rgba(10,20,30,.55)); pointer-events: none; }
  #menu > * { pointer-events: auto; }
  .menu-top { display: flex; gap: 8px; align-items: center; }
  .menu-top .spacer { flex: 1; }
  #menu .title { margin: 8vh 0 0; text-align: center; font-size: 46px; text-shadow: var(--stroke), 0 6px 0 rgba(0,0,0,.35); color: var(--gold); animation: bob 1.6s ease-in-out infinite alternate; }
  .menu-side { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 14px; }
  .menu-bottom { margin-top: auto; display: flex; flex-direction: column; align-items: center; gap: 12px; padding-bottom: 7vh; }
  .btn.big { min-height: 72px; font-size: 28px; padding: 8px 40px; border-radius: 20px; }
  .btn.mid { min-height: 56px; font-size: 20px; padding: 6px 28px; }
  .btn.big, .btn.mid { flex-direction: column; gap: 0; line-height: 1.1; }
  .btn.big > span:first-child, .btn.mid > span:first-child { display: inline-flex; align-items: center; gap: 6px; }
  .btn.locked { filter: grayscale(1) brightness(.8); }
  .btn .sub { font-size: 13px; opacity: .9; text-shadow: none; font-weight: 400; }
  /* 월드맵: 길 위의 점 20개(세로 스크롤). 깬 것 = 별, 다음 것 = 빛남, 나머지 = 자물쇠 */
  #worldScreen { padding: 0; }
  .world-head { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 10px; padding: calc(10px + env(safe-area-inset-top)) 12px 10px; background: linear-gradient(rgba(18,28,40,.96), rgba(18,28,40,.7)); }
  .world-head .spacer { flex: 1; }
  .world-head .btn.gold { min-height: 46px; font-size: 17px; padding: 4px 14px; }
  .world { position: relative; width: 100%; max-width: 480px; margin: 0 auto 30px; aspect-ratio: 360 / 1900; }
  .world svg.road { position: absolute; inset: 0; width: 100%; height: 100%; }
  .node { position: absolute; transform: translate(-50%, -50%); width: 78px; display: flex; flex-direction: column; align-items: center; gap: 3px; background: none; border: 0; padding: 0; font: inherit; color: #fff; text-shadow: var(--stroke); cursor: pointer; }
  .node .circ { width: 58px; height: 58px; border-radius: 50%; background: var(--cream); border: 3px solid var(--brown); box-shadow: 0 4px 0 var(--brown2), 0 6px 12px rgba(0,0,0,.35); display: flex; align-items: center; justify-content: center; font-size: 24px; color: var(--ink); text-shadow: none; transition: transform .05s; }
  .node:active .circ { transform: translateY(3px); }
  .node.cleared .circ { background: #FFE9A8; }
  .node.next .circ { background: var(--green); border-color: #fff; color: #fff; text-shadow: var(--stroke); box-shadow: 0 0 0 5px rgba(255,201,60,.55), 0 4px 0 var(--green2), 0 0 24px rgba(255,201,60,.8); animation: glowPulse 1s ease-in-out infinite alternate; }
  .node.locked .circ { background: #8A8F94; border-color: #4C5358; color: #DDD; box-shadow: 0 3px 0 #3A4045; }
  .node.locked { cursor: default; opacity: .85; }
  .node .stars { display: flex; gap: 1px; height: 16px; }
  .node .stars svg { width: 16px; height: 16px; }
  .node .nm { font-size: 12px; white-space: nowrap; }
  @keyframes glowPulse { from { transform: scale(1); } to { transform: scale(1.08); } }
  /* 강화 나무: 네 갈래, 앞 칸부터 순서대로 */
  .tree { display: flex; flex-direction: column; gap: 12px; }
  .branch { padding: 10px 12px; }
  .branch .top { display: flex; align-items: center; gap: 8px; font-size: 17px; }
  .branch .top svg.i { font-size: 22px; }
  .branch .top .eff { margin-left: auto; color: var(--green2); font-size: 15px; white-space: nowrap; }
  .branch .unit { font-size: 12px; color: var(--ink2); margin-top: 2px; }
  .branch .steps { display: flex; gap: 6px; margin-top: 8px; }
  .step { flex: 1; min-height: 46px; border-radius: 10px; border: 3px solid var(--brown); background: var(--cream2); display: flex; align-items: center; justify-content: center; gap: 2px; font: inherit; font-size: 15px; color: var(--ink); cursor: pointer; padding: 0; transition: transform .05s; }
  .step svg { width: 16px; height: 16px; }
  .step.done { background: var(--gold); border-color: var(--gold2); }
  .step.can { background: var(--green); border-color: var(--green2); color: #fff; text-shadow: var(--stroke); }
  .step.can:active { transform: translateY(3px); }
  .step:disabled { cursor: default; } .step.far { opacity: .5; }
  #treeReset { margin-top: 14px; }
  .mapGrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .mapCard { background: var(--cream); border: 3px solid var(--brown); border-radius: 14px; box-shadow: 0 4px 0 var(--brown2); padding: 6px; color: var(--ink); cursor: pointer; text-align: left; font: inherit; }
  .mapCard canvas { width: 100%; height: 108px; border-radius: 8px; display: block; background: #cfe0b6; }
  .mapCard .nm { font-size: 15px; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mapCard .rec { font-size: 12px; color: var(--ink2); }
  .mapCard.sel { border-color: var(--gold); box-shadow: 0 0 0 3px var(--gold), 0 4px 0 var(--brown2); }
  .panel.list { padding: 10px 14px; font-size: 15px; line-height: 1.7; }
  .panel.list .row { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-bottom: 1px dashed rgba(107,74,43,.3); }
  .panel.list .row:last-child { border-bottom: 0; }
  .panel.list .row .grow { flex: 1; }
  .panel.list .btn { min-height: 40px; font-size: 15px; padding: 4px 12px; }
  .card { position: relative; background: var(--cream); border: 3px solid var(--brown); border-radius: 14px; box-shadow: 0 4px 0 var(--brown2); padding: 8px 4px 6px; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; font: inherit; color: var(--ink); min-height: 96px; }
  .card .art { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 24px; border: 3px solid rgba(0,0,0,.25); box-shadow: inset 0 -4px 0 rgba(0,0,0,.2); }
  .card .nm { font-size: 13px; white-space: nowrap; }
  .card .pr { font-size: 13px; color: var(--gold2); }
  .card.locked { filter: grayscale(1) brightness(.8); }
  .card.locked .lock { position: absolute; top: 6px; right: 6px; font-size: 16px; color: var(--brown); }
  .famRow { display: flex; gap: 8px; overflow-x: auto; padding: 8px 2px 4px; scrollbar-width: none; }
  .famRow::-webkit-scrollbar { display: none; }
  .famRow .card { flex: 0 0 72px; min-height: 90px; }

  /* ---------- 게임 화면 (2026-09-06 참고: 레이드 러시 — 상단 얇은 한 줄, 하단은 낮게, 카드는 3D 그림) ----------
     상단: [←] · 웨이브 진행 막대(칸이 채워진다 + N/M) · [⏸] · 우측에 생명·골드 작은 알약 두 줄. 막대 아래 카운트다운 줄(웨이브 사이에만: "다음 8초" + 적 아이콘), 그 아래 보스 체력 막대(보스가 살아 있을 때만). 자세한 예고는 막대를 누르면 펼쳐진다.
     하단: 판 아래 빈 땅에 카드 한 줄(그림 + 값, 이름은 고르면 뜬다) + 오른쪽 큰 ▶. 실측 숫자는 docs/checklist.md F1. */
  #hud { position: fixed; top: calc(6px + env(safe-area-inset-top)); left: 6px; right: 6px; z-index: 10; display: flex; gap: 6px; align-items: flex-start; pointer-events: none; }
  #hud > * { pointer-events: auto; }
  .ibtn { width: 40px; height: 40px; border-radius: 50%; background: rgba(20,26,34,.55); border: 2px solid rgba(255,255,255,.55); color: #fff; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer; flex: 0 0 auto; box-shadow: 0 2px 6px rgba(0,0,0,.35); }
  .ibtn svg { width: 22px; height: 22px; }
  .ibtn:active { transform: translateY(2px); }
  #waveBar { flex: 1; min-width: 0; margin-top: 2px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; }
  #waveBar .track { width: 100%; height: 22px; border-radius: 12px; background: rgba(20,26,34,.6); border: 2px solid rgba(255,255,255,.5); position: relative; overflow: hidden; }
  #waveBar .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: linear-gradient(#8CE86A, #46B83A); transition: width .4s; }
  #waveBar .ticks { position: absolute; inset: 0; background-image: repeating-linear-gradient(90deg, transparent 0, transparent calc(var(--seg) - 2px), rgba(0,0,0,.35) calc(var(--seg) - 2px), rgba(0,0,0,.35) var(--seg)); }
  #waveBar .num { position: absolute; right: 8px; top: 0; line-height: 18px; font-size: 15px; }
  /* 카운트다운 줄(웨이브 사이): 막대 아래 한 줄(높이 18px ≤ 22px). "다음 8초" 굵게 + 적 아이콘 + 보스·성질 칩. 글자 최소(참고: 레이드 러시 — 판을 안 가린다) */
  #waveBar .cd { display: flex; gap: 6px; align-items: center; height: 18px; max-width: 100%; overflow: hidden; color: #fff; font-size: 13px; text-shadow: var(--stroke); white-space: nowrap; animation: fadeIn .25s; }
  #waveBar .cd .sec { flex: 0 0 auto; font-variant-numeric: tabular-nums; }
  #waveBar .cd .sec.soon { color: #FFC93C; animation: cdPulse .5s ease-in-out infinite alternate; } /* 3초 전부터 노랗게 깜빡 */
  @keyframes cdPulse { from { transform: scale(1); } to { transform: scale(1.12); } }
  #waveBar .cdfoes { display: inline-flex; gap: 1px; align-items: center; height: 16px; min-width: 0; overflow: hidden; }
  #waveBar .cdfoes .foes { display: inline-flex; gap: 1px; align-items: center; }
  #waveBar .cdfoes svg { width: 15px; height: 15px; flex: 0 0 auto; }
  #waveBar .cdfoes .more { font-size: 11px; }
  #waveBar .cdfoes .spc { font-size: 10px; line-height: 1.3; padding: 0 5px; margin-left: 3px; }
  #waveBar .cdfoes .spc.boss { background: #B02A3A; border: 1px solid #FF8080; }
  /* 보스 체력 막대: HUD 아래 한 줄(높이 20px), 알약 열(오른쪽 92px)을 피해서. 두꺼운 테두리 + 붉은 채움 + 깎일 때 흰 번쩍 */
  #bossBar { position: fixed; top: calc(52px + env(safe-area-inset-top)); left: 52px; right: 92px; z-index: 10; display: flex; align-items: center; gap: 6px; pointer-events: none; color: #fff; text-shadow: var(--stroke); font-size: 13px; animation: fadeIn .3s; }
  #bossBar .nm { flex: 0 0 auto; color: #FF8080; }
  #bossBar .track { flex: 1; height: 16px; border-radius: 8px; background: rgba(20,10,12,.7); border: 3px solid #FFD0D0; box-shadow: 0 0 0 2px #7A1020, 0 2px 8px rgba(0,0,0,.5); position: relative; overflow: hidden; }
  #bossBar .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; background: linear-gradient(#FF6A5E, #C0202A); transition: width .15s; }

  .difflist { display: flex; flex-direction: column; gap: 8px; }
  .diffbtn { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: center; text-align: left; font: inherit; color: #fff; text-shadow: var(--stroke); border: 3px solid rgba(0,0,0,.35); border-radius: 14px; padding: 10px 14px; cursor: pointer; box-shadow: 0 4px 0 rgba(0,0,0,.35); transition: transform .05s; }
  .diffbtn:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,.35); }
  .diffbtn.normal { background: var(--green); } .diffbtn.hard { background: var(--red); }
  .diffbtn.locked { filter: grayscale(1) brightness(.7); cursor: default; }
  .diffbtn .dname { font-size: 21px; }
  .diffbtn .dsub { grid-column: 1; font-size: 12.5px; opacity: .95; text-shadow: none; }
  .diffbtn .dstars { grid-column: 2; grid-row: 1 / span 2; display: flex; gap: 2px; }
  .diffbtn .dstars svg { width: 24px; height: 24px; }
  .diffbtn .dlock { grid-column: 1 / span 2; font-size: 12px; }
  /* 순위표 */
  .tabs { display: flex; gap: 6px; margin-bottom: 10px; }
  .tabs button { flex: 1; min-height: 44px; font: inherit; font-size: 17px; color: #fff; text-shadow: var(--stroke); background: rgba(255,255,255,.12); border: 3px solid rgba(255,255,255,.25); border-radius: 12px; cursor: pointer; }
  .tabs button.on { background: var(--gold); border-color: var(--gold2); color: #3a2a00; text-shadow: none; }
  #recordBody { display: flex; flex-direction: column; gap: 10px; }
  .sumbox { display: flex; justify-content: space-around; padding: 10px 6px; }
  .sumcell { display: flex; align-items: center; gap: 3px; font-size: 20px; }
  .sumcell svg { width: 22px; height: 22px; } .sumcell small { font-size: 11px; color: var(--ink2); }
  .sumcell.tot { border-left: 2px solid rgba(107,74,43,.3); padding-left: 8px; }
  .rankbox, .stlist { padding: 8px 12px; }
  .rhead { font-size: 15px; padding: 4px 0 6px; border-bottom: 2px solid rgba(107,74,43,.35); margin-bottom: 4px; }
  .rhead small, .dhead small { font-size: 11.5px; color: var(--ink2); font-weight: 400; margin-left: 4px; }
  .rk { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px dashed rgba(107,74,43,.25); font-size: 14.5px; min-height: 36px; }
  .rk:last-child { border-bottom: 0; }
  .rk.me { background: rgba(255,201,60,.18); margin: 0 -8px; padding-left: 8px; padding-right: 8px; border-radius: 8px; }
  .rk .pos { width: 22px; text-align: center; color: var(--ink2); }
  .rk .nm { flex: 1; min-width: 44px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rk .nm small { color: var(--ink2); font-size: 11px; }
  .rk .v { white-space: nowrap; font-size: 13px; color: var(--ink2); } .rk .v b { color: var(--ink); font-size: 15px; }
  .rk .cr { display: flex; gap: 3px; flex-wrap: wrap; justify-content: flex-end; min-width: 0; }
  .rk.dim, .dim { color: var(--ink2); font-size: 13px; }
  .rk .grow { flex: 1; }
  .ctag { display: inline-flex; align-items: center; gap: 1px; font-size: 11px; background: #FFF3C4; border: 1px solid var(--gold2); border-radius: 999px; padding: 0 6px; color: #5a3d00; white-space: nowrap; }
  .ctag svg { width: 13px; height: 13px; }
  svg.sm { width: 14px; height: 14px; }
  .srow { border-bottom: 1px dashed rgba(107,74,43,.25); }
  .srow:last-child { border-bottom: 0; }
  .srow.locked { opacity: .55; }
  .shead { display: flex; align-items: center; gap: 8px; padding: 7px 0; cursor: pointer; font-size: 14.5px; min-height: 40px; }
  .shead .no { width: 24px; text-align: center; color: var(--ink2); font-size: 13px; }
  .shead .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .shead .st { display: inline-flex; gap: 0; line-height: 0; }
  .shead .fb { font-size: 11px; background: var(--blue); color: #fff; border-radius: 999px; padding: 0 6px; text-shadow: var(--stroke); }
  .srow.open .shead { background: rgba(0,0,0,.05); margin: 0 -12px; padding-left: 12px; padding-right: 12px; }
  .dsec { padding: 4px 0 8px 8px; }
  .dhead { display: flex; align-items: center; gap: 6px; font-size: 13.5px; padding: 6px 0 2px; }
  .dhead .btn { margin-left: auto; }
  /* 홈 화면 안내 배너 */
  .a2hs { position: absolute; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); display: flex; align-items: center; gap: 6px; padding: 4px 8px; font-size: 12.5px; z-index: 2; border-radius: 999px; }
  .a2hs .grow { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .a2hs .btn.tiny { min-height: 28px; font-size: 12px; padding: 0 8px; }
  #endCode { min-height: 50px; font-size: 17px; }
  .clock { color: #E8A23A; font-size: 11px; white-space: nowrap; }
  /* 타워 카드 상세(길게 누르거나 위로 밀면): 돌아가는 3D 모형 + 3단 카드(참고: 레이드 러시 컬렉션 — 속성색 배경 카드 + 단 라벨) */
  .tdetail { padding: 12px 14px; }
  .tdetail .head { display: flex; align-items: center; gap: 10px; }
  .tdetail .head b { font-size: 21px; }
  .tdetail .tags { display: flex; gap: 4px; flex-wrap: wrap; }
  .tdetail .view { display: flex; justify-content: center; margin: 4px 0; border-radius: 14px; background: radial-gradient(circle at 50% 40%, rgba(255,255,255,.55), rgba(0,0,0,.08)); }

  .tier { border-radius: 10px; padding: 4px 4px 6px; color: #fff; text-shadow: var(--stroke); text-align: center; border: 2px solid rgba(255,255,255,.65); box-shadow: inset 0 -10px 0 rgba(0,0,0,.18); font-size: 11.5px; line-height: 1.35; }
  .tier img { width: 56px; height: 56px; display: block; margin: -6px auto -4px; filter: drop-shadow(0 2px 2px rgba(0,0,0,.4)); }
  .tier .lv { display: inline-block; background: rgba(0,0,0,.45); border-radius: 999px; padding: 0 8px; font-size: 12px; margin-bottom: 2px; }
  .tier .st { display: block; font-size: 11px; opacity: .95; }
  .tdetail .up { font-size: 13px; color: var(--ink2); margin: 0; line-height: 1.4; }
  .tdetail .branches { display: flex; gap: 6px; }
  .tdetail .branches span { flex: 1; border-radius: 8px; padding: 3px 6px; color: #fff; text-shadow: var(--stroke); font-size: 12px; line-height: 1.3; }
  /* 자리 미리보기(카드 고르고 빈 자리 누름): 사거리 원판 + 반투명 모형 + [짓기] */
  #pop .btn.build { min-width: 120px; } /* 오늘의 판을 폰 날짜로 판단 중 — 서버 시각과 구분 */

  @media (min-width: 700px) { #towerBar, #bottom { left: 50%; right: auto; transform: translateX(-50%); width: min(640px, 100vw - 16px); } .tree, .panel.list, .mapGrid, #recordBody, .tabs { max-width: 700px; width: 100%; margin-left: auto; margin-right: auto; } }

<body>
<!-- 로딩 화면: 스크립트를 받기 전에 먼저 뜬다. 진행은 아래 boot 스크립트(NGN_LOADING)가 채운다 -->
<div id="loading">
  <h1 class="title">P의 디펜스</h1>
  <div class="bar"><div class="fill" id="loadFill"></div><span class="pct" id="loadPct">0%</span></div>
  <div class="what" id="loadWhat">준비하는 중…</div>
  <div class="tip" id="loadTip"></div>
</div>
<div id="stage"></div>

<!-- 메인 메뉴: 배경은 3D 지도(다음 스테이지)가 천천히 돈다. 큰 [▶ 스테이지 N], 그 아래 [무한](스테이지 10 뒤 열림), 가장자리에 뽑기·기록·설정 -->
<section id="menu" class="overlay" hidden>
  <div class="menu-top"><span class="pill" id="menuTickets"></span><span class="pill" id="menuStars"></span><span class="spacer"></span><span class="pill" id="menuBest"></span></div>
  <h1 class="title">P의 디펜스</h1>
  <div class="menu-side">
    <button class="rbtn" id="menuGacha"><span class="circ"><svg class="i" viewBox="0 0 24 24"><path fill="currentColor" d="M20 7h-2.2A3 3 0 0 0 13 3.3 3 3 0 0 0 6.2 7H4a1 1 0 0 0-1 1v3h18V8a1 1 0 0 0-1-1zM8.3 5.5c.8 0 2 .7 2.9 1.5H8.5a1 1 0 0 1-.2-1.5zm7.4 0a1 1 0 0 1-.2 1.5h-2.7c.9-.8 2.1-1.5 2.9-1.5zM4 13v7a1 1 0 0 0 1 1h6v-8H4zm9 8h6a1 1 0 0 0 1-1v-7h-7v8z"/></svg></span>뽑기<span class="dot" id="menuGachaDot" hidden></span></button>
    <button class="rbtn" id="menuRecords"><span class="circ"><svg class="i" viewBox="0 0 24 24"><path fill="currentColor" d="M5 21V10h4v11H5zm5 0V3h4v18h-4zm5 0v-7h4v7h-4z"/></svg></span>기록</button>
    <button class="rbtn" id="menuSettings"><span class="circ"><svg class="i" viewBox="0 0 24 24"><path fill="currentColor" d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.7 7.7 0 0 0-1.7-1L15 3H9l-.3 2.9a7.7 7.7 0 0 0-1.7 1l-2.5-1-2 3.5L4.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.7 7.7 0 0 0 1.7 1L9 21h6l.3-2.9a7.7 7.7 0 0 0 1.7-1l2.5 1 2-3.5L19.4 13zM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7z"/></svg></span>설정</button>
  </div>
  <div class="menu-bottom">
    <button class="btn green big" id="menuPlay">▶ 스테이지 1</button>
    <button class="btn blue mid" id="menuInfinite"></button>
    <button class="btn gold mid" id="menuDaily"></button>
  </div>
  <!-- 저장 지킴이(I-12): 아이폰 사파리는 7일 안 들어오면 저장을 지운다. 홈 화면 앱은 면제 -->
  <div class="panel a2hs" id="a2hs" hidden><span class="grow"><b>홈 화면에 추가</b>하면 기록이 안 지워져요</span><button class="btn blue tiny" id="a2hsMore">방법</button><button class="btn gray tiny" id="a2hsClose">닫기</button></div>
</section>

<!-- 난이도 고르기(I-3): 월드맵 점을 누르면. 어려움은 보통으로 깨야 열린다 -->
<div class="modalWrap" id="diffModal" hidden><div class="panel modal"><h3 id="diffTitle"></h3><div class="difflist" id="diffList"></div><div class="row"><button class="btn gray" id="diffClose">닫기</button></div></div></div>
<!-- 코드 보기/넣기·이름 묻기(records.js 가 채운다) -->
<div class="modalWrap" id="codeModal" hidden></div>

<!-- 월드맵: 길 위의 점 20개. 점을 누르면 덱 편성 없이 바로 전투 -->
<section id="worldScreen" class="overlay scroll" hidden>
  <div class="world-head"><button class="btn blue back" id="worldBack">◀</button><span class="pill" id="worldStars"></span><span class="spacer"></span><button class="btn gold" id="worldUpgrade"></button></div>
  <div class="world" id="world"></div>
</section>

<!-- 강화 나무: 별을 쓰는 곳. 되돌리기 무료 -->
<section id="upgradeScreen" class="overlay scroll" hidden>
  <div class="screen-head"><button class="btn blue back" id="upgradeBack">◀</button><h2>강화</h2><span class="spacer" style="flex:1"></span><span class="pill" id="upgradeStars"></span></div>
  <p class="sub" style="margin:0 0 10px">남은 별로 앞 칸부터 찍는다. 잘못 찍었으면 아래 [전부 되돌리기] — 별은 전부 돌아온다.</p>
  <div class="tree" id="tree"></div>
  <button class="btn red" id="treeReset">전부 되돌리기</button>
</section>

<!-- 무한 모드 지도 선택(스테이지 10 을 깨야 열린다). 기록 겨루기는 여기서만 -->
<section id="mapScreen" class="overlay scroll" hidden>
  <div class="screen-head"><button class="btn blue back" id="mapBack">◀</button><h2>무한 모드 <span class="sub">지도를 고르면 끝없이 이어진다 · 지도마다 기록</span></h2></div>
  <div class="mapGrid" id="mapGrid"></div>
  <div class="screen-foot two"><button class="btn gray" id="mapMore">지도 더 보기 +12</button><button class="btn green big" id="mapStart" disabled>▶ 출전</button></div>
</section>

<!-- 순위표(I-10): 캠페인·무한·도전 세 탭. 친구 기록은 코드로 — 바깥 서비스 없음 -->
<section id="recordScreen" class="overlay scroll" hidden>
  <div class="screen-head"><button class="btn blue back" id="recordBack">◀</button><h2>순위표</h2><span class="spacer" style="flex:1"></span><button class="btn gold tiny" id="recordName"></button></div>
  <div class="tabs" id="recordTabs"><button data-tab="campaign" class="on">캠페인</button><button data-tab="infinite">무한</button><button data-tab="daily">도전</button></div>
  <div id="recordBody"></div>
  <div class="screen-foot two"><button class="btn gray" id="recordFriends">친구 관리</button><button class="btn blue" id="recordPaste">친구 코드 넣기</button></div>
</section>

<!-- 설정 -->
<section id="settingScreen" class="overlay scroll" hidden>
  <div class="screen-head"><button class="btn blue back" id="settingBack">◀</button><h2>설정</h2></div>
  <div class="panel list" id="settingList"></div>
</section>

<div id="game" hidden>
  <div id="hud">
    <button class="ibtn" id="btnMenu" title="나가기"><svg viewBox="0 0 24 24"><path fill="#fff" d="M15 4 7 12l8 8 2-2-6-6 6-6z"/></svg></button>
    <div id="waveBar"><div class="track"><div class="fill"></div><div class="ticks"></div><span class="num" id="waveNo">1/8</span></div>
      <!-- 카운트다운 줄(웨이브 사이에만): "다음 8초" + 다음 웨이브 적 아이콘 + 보스/성질 칩. 웨이브 중엔 사라진다 -->
      <div class="cd" id="countdown" hidden><span class="sec" id="cdSec"></span><span class="cdfoes" id="cdFoes"></span></div>
    </div>
    <button class="ibtn" id="pauseBtn" title="일시정지"><svg viewBox="0 0 24 24"><path fill="#fff" d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg></button>
    <div id="hudRight">
      <span class="mpill" id="lifePill"><svg class="i" viewBox="0 0 24 24"><path fill="#E8443A" d="M12 21s-7.5-4.6-9.5-9.3C1 8 3.4 4.5 7 4.5c2 0 3.6 1.1 5 2.8 1.4-1.7 3-2.8 5-2.8 3.6 0 6 3.5 4.5 7.2C19.5 16.4 12 21 12 21z"/></svg><span class="num" id="lives">20</span></span>
      <span class="mpill" id="goldPill"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#F5B301"/><circle cx="12" cy="12" r="7" fill="#FFD84D"/><path d="M12 7v10M9.5 9.5h4a1.75 1.75 0 0 1 0 3.5h-3a1.75 1.75 0 0 0 0 3.5h4" stroke="#B8860B" stroke-width="1.8" fill="none"/></svg><span class="num gold" id="gold">60</span></span>
      <span class="mpill" id="bagPill" hidden title="가방 — 떨어진 아이템. 타워를 눌러 끼운다"></span>
    </div>
  </div>
  <!-- 보스 체력 막대: 보스가 살아 있는 동안만 HUD 바로 아래 한 줄. 깎일 때 흰 번쩍(.flash) -->
  <div id="bossBar" hidden><span class="nm">보스</span><div class="track"><div class="fill"></div><div class="glint"></div></div><span class="pct" id="bossPct">100%</span></div>
  <div id="nextDetail" class="panel" hidden></div>
  <!-- 성이 맞았을 때 가장자리 붉은 번쩍(0.35초) · 적이 출구 가까이 오면 천천히 깜빡이는 붉은 비네트 -->
  <div id="dmgFlash"></div>
  <div id="danger" hidden></div>
  <!-- 일시정지: 엔진·카운트다운·연출 전부 멈춤. [계속] [나가기] -->
  <div id="pauseOverlay" hidden><div class="ptitle">일시정지</div><div class="prow"><button class="btn green big" id="pauseResume">계속</button><button class="btn gray mid" id="pauseQuit">나가기</button></div></div>
  <div id="bottom">
    <button class="ibtn" id="rotateBtn" title="돌리기"><svg viewBox="0 0 24 24"><path fill="#fff" d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg></button>
    <div id="towerBar"></div>
    <button class="btn green" id="waveBtn" title="웨이브 시작"><svg viewBox="0 0 24 24"><path fill="#fff" d="M8 5v14l11-7z"/></svg></button>
  </div>
  <div id="pop" hidden></div>
  <div id="hint" hidden><div class="arrow"></div><div class="txt panel"></div></div>
  <div id="floaters"></div>
  <div id="toast" class="panel" hidden></div>
</div>

<section id="endScreen" hidden>
  <h1 id="endTitle"></h1>
  <div class="endStars" id="endStars" hidden></div>
  <div class="panel"><div id="endBody"></div><div id="ticketLines"></div></div>
  <button id="endCode" class="btn gold" hidden>기록 코드 — 단톡방에 올리기</button>
  <div id="endBtns">
    <button id="endNext" class="btn green">다음 스테이지 ▶</button>
    <button id="endRetry" class="btn blue">다시</button>
    <button id="endWorld" class="btn gray">월드맵</button>
    <button id="endGacha" class="btn gold">뽑기 하러 가기</button>
    <button id="endRecords" class="btn blue">순위표</button>
    <button id="endMenu" class="btn gray">메뉴</button>
  </div>
</section>

<section id="gachaScreen" hidden>
  <div class="gacha-head"><h1>뽑기</h1><span class="pill" id="ticketCount"></span><button id="gachaClose" class="btn gray" style="min-height:44px;font-size:16px">닫기</button></div>
  <div id="gachaStage">
    <div id="gachaCard" class="card3d">
      <div class="face back">?</div>
      <div class="face front"><div class="grade"></div><div class="name"></div></div>
    </div>
    <div id="gachaBurst"></div>
  </div>
  <div class="gacha-actions"><button id="pullBtn" class="btn gold">1장 뽑기</button><button id="pull10Btn" class="btn gold">10장 뽑기</button></div>
  <div id="pityInfo"></div>
  <div id="gachaLog"></div>
  <div id="perkSummary"></div>
</section>
<div id="gachaFlash"></div>

<!-- 부팅: 스크립트를 하나씩 받으며 로딩 막대를 채운다(0~30%). 그 뒤 데이터·모델은 main.js 가 NGN_LOADING 으로 이어 채운다.
     파일 위치는 window.__NGN_PATHS__(나눔 빌드가 넣는다)로 바꾼다. 번들(단일 HTML)은 __NGN_INLINE__ 을 세워 이 목록을 안 받고 뒤에 인라인된 것을 쓴다.
     SCRIPTS 는 유효한 JSON 배열이어야 한다 — game/build.js·bundle.js 가 이 줄을 읽는다 -->
<script>window.__NGN_VERSION__ = "fe391d55a1"; window.__NGN_PATHS__ = { data: "data/", assets: "assets/", sim: "js/sim/", vendor: "js/vendor/" };</script>
<script>
(function () {
  const P = Object.assign({ sim: '../sim/', vendor: 'vendor/', data: '../data/', assets: '../assets/' }, window.__NGN_PATHS__ || {});
  const SCRIPTS = ["vendor/three.r128.min.js", "vendor/GLTFLoader.r128.js", "vendor/SimplexNoise.js", "vendor/LightningStrike.js", "vendor/lz-string.1.5.0.min.js", "sim/map.js", "sim/mapgen.js", "sim/engine.js", "sim/ai.js", "sim/build-waves.js", "js/data.js", "js/world.js", "js/fx.js", "js/models.js", "js/render.js", "js/ui.js", "js/meta.js", "js/records.js", "js/gacha.js", "js/main.js"];
  const TIPS = ["공중 적에겐 <b>대공</b>이 되는 타워를 — 카드의 화살표를 보세요", "타워를 <b>길게 누르면</b> 설명과 3단 모습이 나와요", "3단 승급은 <b>화력</b>과 <b>광역</b> 중 하나 — 정답은 없어요", "별은 <b>강화</b>에 쓰고, 잘못 찍었으면 전부 되돌리기(무료)", "어려움은 적 체력이 <b>2배</b> — 붉은 별은 따로 셉니다", "<b>홈 화면에 추가</b>하면 인터넷 없이도 열려요", "떨어진 <b>아이템</b>은 타워를 눌러 끼우세요 — 판이 끝나면 사라져요", "<b>기록 코드</b>를 단톡방에 올리면 친구 순위표에 나란히 떠요", "적 발밑 <b>색 고리</b>가 성질 — 갑옷·질주·재생·분열…", "<b>오늘의 판</b>은 하루 한 번, 모두 같은 지도·같은 조건"];
  const fill = document.getElementById('loadFill'), pct = document.getElementById('loadPct'), what = document.getElementById('loadWhat'), tip = document.getElementById('loadTip'), box = document.getElementById('loading');
  box.style.backgroundImage = `url(${P.assets}loading.jpg)`;
  let tipNo = Math.floor(Math.random() * TIPS.length);
  const showTip = () => { tip.innerHTML = TIPS[tipNo % TIPS.length]; tipNo++; tip.style.animation = 'none'; void tip.offsetWidth; tip.style.animation = ''; };
  showTip(); const tipTimer = setInterval(showTip, 2600);
  let cur = 0;
  window.NGN_LOADING = {
    set(p, label) { cur = Math.max(cur, Math.min(100, p)); fill.style.width = cur + '%'; pct.textContent = Math.round(cur) + '%'; if (label) what.textContent = label; },
    fail(msg) { what.textContent = '문제가 생겼어요: ' + msg; box.classList.add('fail'); },
    done() { this.set(100, '준비 완료!'); clearInterval(tipTimer); setTimeout(() => { box.classList.add('out'); setTimeout(() => box.remove(), 500); }, 250); },
  };
  if (window.__NGN_INLINE__) return; // 번들: 스크립트가 이미 아래에 심겨 있다
  const url = (s) => s.startsWith('vendor/') ? P.vendor + s.slice(7) : s.startsWith('sim/') ? P.sim + s.slice(4) : s;
  const names = { three: '3D 엔진', GLTFLoader: '모델 읽기', Lightning: '번개', Simplex: '번개', lz: '기록 코드', map: '지도', mapgen: '지도 생성기', engine: '게임 규칙', ai: '자동 플레이', 'build-waves': '웨이브', data: '데이터', world: '세계', fx: '효과', models: '부품', render: '연출', ui: '화면', meta: '진행 저장', records: '순위표', gacha: '뽑기', main: '시작' };
  (async () => {
    for (let i = 0; i < SCRIPTS.length; i++) {
      const s = SCRIPTS[i];
      const key = Object.keys(names).find((k) => s.includes(k));
      window.NGN_LOADING.set(i / SCRIPTS.length * 30, `${names[key] || s} 받는 중…`);
      await new Promise((ok, bad) => { const el = document.createElement('script'); el.src = url(s); el.onload = ok; el.onerror = () => bad(new Error(s)); document.body.appendChild(el); });
    }
    window.NGN_LOADING.set(30, '데이터 받는 중…');
  })().catch((e) => window.NGN_LOADING.fail('파일을 못 받았어요 (' + e.message + ') — 인터넷을 확인하고 다시 열어 주세요'));
})();
</script>
